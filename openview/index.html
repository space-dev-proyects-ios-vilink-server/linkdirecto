<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Ventana · Historial + Anti-popups (fix)</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#0e1116;color:#e6edf3;
  }
  .topbar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;
    padding:8px 12px;background:#161b22;border-bottom:1px solid #2a313c;
  }
  .brand{font-weight:700;font-size:14px;align-self:center;margin-right:4px;white-space:nowrap}
  .field{display:flex;flex-direction:column;gap:2px;font-size:10px;color:#8b949e}
  .field label{text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  input[type=text],input[type=number]{
    background:#0d1117;border:1px solid #30363d;color:#e6edf3;
    padding:6px 8px;border-radius:6px;font-size:12.5px;outline:none;transition:.12s;
  }
  input[type=text]:focus,input[type=number]:focus{border-color:#388bfd;box-shadow:0 0 0 2px rgba(56,139,253,.25)}
  .url-field{flex:1 1 300px}
  .url-field input{width:100%}
  input[type=number]{width:82px}
  .checks{
    display:flex;flex-wrap:wrap;gap:9px;align-items:center;
    padding:4px 0;font-size:11.5px;
  }
  .checks label{display:flex;align-items:center;gap:4px;color:#c9d1d9;cursor:pointer}
  .checks input{accent-color:#1f6feb;cursor:pointer;margin:0}
  .checks .key{color:#d29922}
  .buttons{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  button{
    background:#21262d;border:1px solid #30363d;color:#e6edf3;
    padding:6px 11px;border-radius:6px;font-size:12px;cursor:pointer;
    font-family:inherit;white-space:nowrap;transition:.12s;
  }
  button:hover{background:#2d333b}
  button.primary{background:#1f6feb;border-color:#1f6feb}
  button.primary:hover{background:#388bfd}
  button.ok{background:#238636;border-color:#238636}
  button.ok:hover{background:#2ea043}
  button.warn{background:#9e6a03;border-color:#9e6a03}
  button.warn:hover{background:#bb8009}
  button:disabled{opacity:.4;cursor:not-allowed}

  .statusbar{
    display:flex;gap:16px;flex-wrap:wrap;padding:5px 12px;
    background:#0d1117;border-bottom:1px solid #21262d;font-size:11.5px;color:#8b949e;
  }
  .statusbar b{color:#e6edf3;font-weight:600}
  .statusbar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#484f58;margin-right:5px;vertical-align:middle;transition:.2s}
  .statusbar .dot.on{background:#3fb950;box-shadow:0 0 8px #3fb950}

  .history-bar{
    display:flex;gap:8px;align-items:center;
    padding:5px 12px;background:#0a0d12;border-bottom:1px solid #21262d;
    flex-shrink:0;font-size:11px;min-height:32px;
  }
  .history-label{color:#8b949e;font-weight:600;white-space:nowrap;font-size:11px}
  .history-chips{
    display:flex;gap:5px;flex:1;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:thin;scrollbar-color:#30363d transparent;
  }
  .history-chips::-webkit-scrollbar{height:5px}
  .history-chips::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
  .chip{
    background:#21262d;border:1px solid #30363d;color:#c9d1d9;
    padding:2px 4px 2px 9px;border-radius:12px;font-size:11px;
    cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;
    gap:5px;flex-shrink:0;font-family:inherit;transition:.12s;
  }
  .chip:hover{background:#2d333b;border-color:#484f58}
  .chip-del{
    color:#6e7681;font-weight:bold;font-size:14px;line-height:1;
    cursor:pointer;padding:0 3px;border-radius:50%;
  }
  .chip-del:hover{color:#f85149;background:rgba(248,81,73,.15)}
  .chip-meta{color:#6e7681;font-size:9.5px}
  .history-empty{color:#484f58;font-size:11px;font-style:italic}
  .mini{padding:1px 7px;font-size:11px;border-radius:5px;line-height:1.4}

  .grid{
    flex:1;min-height:0;display:grid;gap:8px;padding:8px;overflow:auto;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  }
  .pane{
    display:flex;flex-direction:column;min-height:220px;
    background:#161b22;border:1px solid #21262d;border-radius:8px;overflow:hidden;
    transition:box-shadow .15s;
  }
  .pane.flash{box-shadow:0 0 0 2px #3fb950, 0 0 14px rgba(63,185,80,.45)}
  .pane-head{
    display:flex;align-items:center;gap:6px;padding:5px 8px;
    background:#1b2230;border-bottom:1px solid #21262d;font-size:11.5px;
  }
  .pane-title{font-weight:600;font-size:12px}
  .badge{
    background:#0d1117;border:1px solid #30363d;border-radius:20px;
    padding:1px 7px;font-size:10.5px;color:#8b949e;white-space:nowrap;
  }
  .badge.ok{color:#3fb950;border-color:#238636}
  .badge.load{color:#d29922;border-color:#9e6a03}
  .badge.warn{color:#f85149;border-color:#da3633}
  .spacer{flex:1}

  .frame-wrap{
    flex:1;min-height:0;position:relative;background:#0d1117;overflow:hidden;
  }
  .frame-wrap.scrollable{overflow-y:auto;overflow-x:hidden}
  .frame-wrap iframe{width:100%;height:100%;border:0;background:#fff;display:block}
  .frame-wrap.scrollable iframe{height:3000px}
  .placeholder{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#484f58;font-size:12px;text-align:center;padding:16px;line-height:1.4;
  }

  .toast{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1f6feb;color:#fff;padding:9px 16px;border-radius:7px;font-size:12px;
    opacity:0;pointer-events:none;transition:.25s;z-index:99;
    box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🪟 Multi-Ventana</div>

  <div class="field url-field">
    <label for="url">Enlace a abrir en las 5 ventanas</label>
    <input id="url" type="text" placeholder="https://ejemplo.com" spellcheck="false" autocomplete="off">
  </div>

  <div class="field">
    <label for="interval">Recarga (s)</label>
    <input id="interval" type="number" min="1" step="1" value="5">
  </div>

  <div class="field">
    <label for="limit">Límite ciclos</label>
    <input id="limit" type="number" min="0" step="1" value="0" title="0 = sin límite">
  </div>

  <div class="field">
    <label for="speed">Vel. scroll</label>
    <input id="speed" type="number" min="1" max="10" step="1" value="2">
  </div>

  <div class="field">
    <label for="clickEvery">Click cada (s)</label>
    <input id="clickEvery" type="number" min="1" step="1" value="4">
  </div>

  <div class="checks">
    <label><input type="checkbox" id="scrollOn" checked> Scroll</label>
    <label><input type="checkbox" id="clickOn" checked> Clicks</label>
    <label><input type="checkbox" id="noCache"> Sin caché</label>
    <label><input type="checkbox" id="proxyOn" title="Evita X-Frame-Options"> Proxy</label>
    <label class="key" title="Rompe algunas webs. Úsalo solo si necesitas bloquear popups al 100%">
      <input type="checkbox" id="sandboxOn"> Sandbox estricto
    </label>
    <label><input type="checkbox" id="popupMode"> Popups</label>
    <label><input type="checkbox" id="manualOnly"> Sin auto</label>
  </div>

  <div class="buttons">
    <button id="applyBtn" class="primary">Aplicar a las 5</button>
    <button id="startBtn" class="ok">▶ Iniciar</button>
    <button id="stopBtn" class="warn" disabled>⏸ Detener</button>
    <button id="reloadAllBtn">⟳ Recargar</button>
    <button id="resetBtn">↺ Reiniciar</button>
  </div>
</header>

<div class="statusbar">
  <span><span id="runDot" class="dot"></span><b id="statusText">Listo</b></span>
  <span id="cycleText">Ciclos: <b>0</b> / ∞</span>
  <span id="totalText">Recargas: <b>0</b></span>
  <span id="activityText">Scroll: ON · Clicks: ON</span>
  <span style="margin-left:auto;color:#484f58">Si una web sale en blanco → activa <b>Proxy</b></span>
</div>

<div class="history-bar">
  <span class="history-label">🕘 Historial</span>
  <div class="history-chips" id="historyChips"></div>
  <button class="mini" id="clearHistoryBtn">Limpiar</button>
</div>

<main id="grid" class="grid"></main>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   Referencias DOM
   ========================================================= */
const $ = id => document.getElementById(id);
const grid = $('grid');
const urlInput = $('url');
const intervalIn = $('interval');
const limitIn = $('limit');
const speedIn = $('speed');
const clickEveryIn = $('clickEvery');
const scrollOn = $('scrollOn');
const clickOn = $('clickOn');
const sandboxOn = $('sandboxOn');
const noCache = $('noCache');
const proxyOn = $('proxyOn');
const popupMode = $('popupMode');
const manualOnly = $('manualOnly');
const applyBtn = $('applyBtn');
const startBtn = $('startBtn');
const stopBtn = $('stopBtn');
const reloadAllBtn = $('reloadAllBtn');
const resetBtn = $('resetBtn');
const statusText = $('statusText');
const runDot = $('runDot');
const cycleText = $('cycleText');
const totalText = $('totalText');
const activityText = $('activityText');
const historyChips = $('historyChips');
const clearHistoryBtn = $('clearHistoryBtn');

/* =========================================================
   Estado
   ========================================================= */
const PANE_COUNT = 5;
const HISTORY_KEY = 'mw_history_v1';
const HISTORY_MAX = 30;

/* Sandbox SOLO cuando el usuario lo activa explícitamente.
   Sin allow-popups ni allow-top-navigation → bloquea escapes.
   allow-same-origin permite que la web funcione normal. */
const SANDBOX_STR = 'allow-scripts allow-forms allow-same-origin allow-modals allow-downloads allow-pointer-lock';

const state = {
  url: '',
  running: false,
  timer: null,
  cycles: 0,
  totalReloads: 0,
  windows: [],
  raf: null,
  clickTimers: []
};
const panes = [];

/* =========================================================
   Crear paneles
   ========================================================= */
for (let i = 0; i < PANE_COUNT; i++) {
  const el = document.createElement('div');
  el.className = 'pane';
  el.innerHTML = `
    <div class="pane-head">
      <span class="pane-title">Ventana ${i + 1}</span>
      <span class="badge count" title="Recargas de esta ventana">0</span>
      <span class="spacer"></span>
      <span class="badge status" title="Estado de la ventana">vacía</span>
      <button class="mini" data-act="reload" title="Recargar esta ventana">⟳</button>
    </div>
    <div class="frame-wrap">
      <div class="placeholder">Sin enlace.<br>Pega una URL y pulsa «Aplicar a las 5».</div>
    </div>`;
  grid.appendChild(el);

  const pane = {
    index: i,
    el,
    wrap: el.querySelector('.frame-wrap'),
    countEl: el.querySelector('.count'),
    statusEl: el.querySelector('.status'),
    iframe: null,
    count: 0,
    scrollPause: 0
  };

  el.querySelector('[data-act="reload"]')
    .addEventListener('click', () => { if (state.url) reloadPane(pane); });

  panes.push(pane);
}

/* =========================================================
   Utilidades
   ========================================================= */
function normalizeUrl(raw) {
  const v = (raw || '').trim();
  if (!v) return '';
  if (/^[a-z][a-z0-9+.\-]*:\/\//i.test(v)) return v;
  return 'https://' + v;
}

function applyProxy(url) {
  if (!proxyOn.checked || !url) return url;
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/\./g, '-');
    const proxy = new URL(`https://${host}.translate.goog${u.pathname}`);
    u.searchParams.forEach((v, k) => proxy.searchParams.set(k, v));
    proxy.searchParams.set('_x_tr_sl', 'auto');
    proxy.searchParams.set('_x_tr_tl', 'es');
    proxy.searchParams.set('_x_tr_hl', 'es');
    proxy.hash = u.hash;
    return proxy.toString();
  } catch (e) { return url; }
}

function buildUrl() {
  if (!state.url) return '';
  let u = state.url;
  if (noCache.checked) {
    try {
      const o = new URL(u);
      o.searchParams.set('_ts', Date.now());
      u = o.toString();
    } catch (e) {}
  }
  return applyProxy(u);
}

function setStatus(txt) { statusText.textContent = txt; }

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function updatePaneCount(p) { p.countEl.textContent = p.count; }

function updateStatusBar() {
  const limit = Math.max(0, parseInt(limitIn.value, 10) || 0);
  cycleText.innerHTML = `Ciclos: <b>${state.cycles}</b> / ${limit > 0 ? limit : '∞'}`;
  totalText.innerHTML = `Recargas: <b>${state.totalReloads}</b>`;
  activityText.innerHTML = `Scroll: <b>${scrollOn.checked ? 'ON' : 'off'}</b> · Clicks: <b>${clickOn.checked ? 'ON' : 'off'}</b>`;
  runDot.classList.toggle('on', state.running);
}

/* =========================================================
   Historial (solo URLs aplicadas)
   ========================================================= */
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
  catch (e) { return []; }
}
function saveHistory(h) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch (e) {}
}
function addToHistory(url) {
  if (!url) return;
  let h = loadHistory().filter(x => x.url !== url);
  h.unshift({ url, ts: Date.now() });
  saveHistory(h.slice(0, HISTORY_MAX));
  renderHistory();
}
function relativeTime(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'ahora';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}
function renderHistory() {
  const h = loadHistory();
  historyChips.innerHTML = '';
  if (!h.length) {
    historyChips.innerHTML = '<span class="history-empty">(sin enlaces guardados)</span>';
    return;
  }
  h.forEach(item => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.title = item.url;

    const label = document.createElement('span');
    const short = item.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
    label.textContent = short.length > 34 ? short.slice(0, 34) + '…' : short;

    const meta = document.createElement('span');
    meta.className = 'chip-meta';
    meta.textContent = relativeTime(item.ts);

    const del = document.createElement('span');
    del.className = 'chip-del';
    del.textContent = '×';
    del.title = 'Eliminar';
    del.addEventListener('click', e => {
      e.stopPropagation();
      saveHistory(loadHistory().filter(x => x.url !== item.url));
      renderHistory();
    });

    chip.append(label, meta, del);
    chip.addEventListener('click', () => {
      urlInput.value = item.url;
      applyToAll();
    });
    historyChips.appendChild(chip);
  });
}
clearHistoryBtn.addEventListener('click', () => {
  if (!confirm('¿Vaciar todo el historial?')) return;
  saveHistory([]);
  renderHistory();
});
renderHistory();

/* =========================================================
   Interceptor SEGURO (solo same-origin)
   - <a target="..."> y <form target="..."> → fuerza _self
   - window.open() → devuelve null (bloquea sin recargar)
   NO navega el iframe desde window.open (evita bucles de recarga)
   ========================================================= */
function injectInterceptor(iframe) {
  try {
    const doc = iframe.contentDocument;
    if (!doc || doc.__mwInjected) return;
    doc.__mwInjected = true;

    /* Links con target != _self → navegar en el mismo panel */
    doc.addEventListener('click', e => {
      let el = e.target;
      while (el && el.tagName !== 'A') el = el.parentElement;
      if (!el) return;
      const href = el.getAttribute('href') || '';
      if (/^(javascript:|mailto:|tel:|#)/i.test(href)) return;
      const tgt = (el.getAttribute('target') || '').toLowerCase();
      if (tgt && tgt !== '_self') {
        e.preventDefault();
        e.stopPropagation();
        try { iframe.src = el.href; } catch (err) {}
      }
    }, true);

    /* Forms con target != _self → forzar _self */
    doc.addEventListener('submit', e => {
      const form = e.target;
      if (!form) return;
      const tgt = (form.getAttribute('target') || '').toLowerCase();
      if (tgt && tgt !== '_self') form.setAttribute('target', '_self');
    }, true);

    /* window.open → bloquear devolviendo null (NO navegar) */
    try {
      const win = iframe.contentWindow;
      if (!win.__mwOpenPatched) {
        win.__mwOpenPatched = true;
        win.open = function () { return null; };
      }
    } catch (err) {}

  } catch (e) {
    /* cross-origin: no hay nada que interceptar */
  }
}

/* =========================================================
   Cargar URL en panel
   ========================================================= */
function setPaneUrl(pane, url) {
  const old = pane.wrap.querySelector('iframe');
  const iframe = document.createElement('iframe');
  iframe.setAttribute('referrerpolicy', 'no-referrer');
  iframe.setAttribute('allow', 'clipboard-write; fullscreen; autoplay; encrypted-media');

  if (sandboxOn.checked) {
    iframe.setAttribute('sandbox', SANDBOX_STR);
  }

  iframe.src = url;
  pane.wrap.classList.remove('scrollable');
  pane.wrap.querySelector('.placeholder')?.remove();
  pane.statusEl.textContent = 'cargando';
  pane.statusEl.className = 'badge status load';
  pane.scrollPause = 0;

  iframe.addEventListener('load', () => {
    if (pane.iframe !== iframe) return;
    setTimeout(() => {
      try {
        const doc = iframe.contentWindow.document;
        if (doc) {
          iframe.classList.add('same-origin');
          iframe.classList.remove('cross-origin');
          pane.wrap.classList.remove('scrollable');
          pane.statusEl.textContent = 'completa';
          pane.statusEl.title = 'Same-origin: enlaces y clicks internos OK';
          pane.statusEl.className = 'badge status ok';
          injectInterceptor(iframe);
          return;
        }
      } catch (e) {}

      /* Cross-origin: sin acceso al contenido. Scroll por wrapper. */
      iframe.classList.add('cross-origin');
      iframe.classList.remove('same-origin');
      pane.wrap.classList.add('scrollable');
      pane.statusEl.textContent = 'cross-origin';
      pane.statusEl.title = 'Web externa. Scroll activo. Para bloquear popups de esta web, activa Sandbox estricto (puede romperla).';
      pane.statusEl.className = 'badge status warn';
    }, 300);
  });

  if (old) pane.wrap.replaceChild(iframe, old);
  else pane.wrap.appendChild(iframe);
  pane.iframe = iframe;
}

/* =========================================================
   Popups
   ========================================================= */
function closePopups() {
  state.windows.forEach(w => { try { if (w && !w.closed) w.close(); } catch (e) {} });
  state.windows = [];
}
function openPopups(url) {
  closePopups();
  let blocked = 0;
  for (let i = 0; i < PANE_COUNT; i++) {
    const w = window.open(url, 'mw_win_' + i,
      'width=900,height=650,menubar=yes,toolbar=yes,scrollbars=yes,resizable=yes');
    state.windows[i] = w;
    const p = panes[i];
    if (w) {
      p.iframe = null;
      p.wrap.innerHTML = '<div class="placeholder">Abierta en ventana emergente</div>';
      p.statusEl.textContent = 'emergente';
      p.statusEl.className = 'badge status ok';
    } else {
      blocked++;
      p.statusEl.textContent = 'bloqueada';
      p.statusEl.className = 'badge status warn';
    }
  }
  if (blocked) toast(`El navegador bloqueó ${blocked} ventana(s). Permite popups.`);
}

/* =========================================================
   Recargar panel
   ========================================================= */
function reloadPane(pane) {
  if (!state.url) return;
  if (popupMode.checked) {
    const w = state.windows[pane.index];
    if (!w || w.closed) return;
    try { w.location.href = buildUrl(); } catch (e) {}
  } else {
    if (!pane.iframe) return;
    setPaneUrl(pane, buildUrl());
  }
  pane.count++;
  state.totalReloads++;
  updatePaneCount(pane);
  updateStatusBar();
}

/* =========================================================
   Ciclo
   ========================================================= */
function cycle(isManual = false) {
  if (!state.url) { if (isManual) toast('Aplica un enlace primero'); return; }
  const limit = Math.max(0, parseInt(limitIn.value, 10) || 0);

  if (!isManual && limit > 0 && state.cycles >= limit) {
    stopAll();
    setStatus('Límite de ciclos alcanzado');
    toast('Se alcanzó el límite');
    return;
  }
  panes.forEach(p => reloadPane(p));
  state.cycles++;
  updateStatusBar();

  if (limit > 0 && state.cycles >= limit) {
    stopAll();
    setStatus('Límite de ciclos alcanzado');
    toast('Se alcanzó el límite');
  }
}

/* =========================================================
   Actividad: scroll + clicks
   ========================================================= */
function scrollPane(pane) {
  const speed = Math.max(1, parseInt(speedIn.value, 10) || 2);
  const wrap = pane.wrap;
  const iframe = pane.iframe;
  if (!iframe) return;
  if (pane.scrollPause > 0) { pane.scrollPause--; return; }

  if (wrap.classList.contains('scrollable')) {
    wrap.scrollTop += speed;
    if (wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 2) {
      wrap.scrollTop = 0;
      pane.scrollPause = 25;
    }
  } else {
    try {
      const win = iframe.contentWindow;
      const doc = iframe.contentDocument;
      if (!win || !doc) return;
      win.scrollBy(0, speed);
      const max = doc.documentElement.scrollHeight - win.innerHeight;
      if (win.scrollY >= max - 2) {
        win.scrollTo(0, 0);
        pane.scrollPause = 25;
      }
    } catch (e) {
      wrap.classList.add('scrollable');
    }
  }
}

function tryRandomClick(pane) {
  if (!pane.iframe) return false;
  try {
    const doc = pane.iframe.contentDocument;
    if (!doc || !doc.body) return false;
    const sel = 'a, button, [role="button"], input[type="submit"], input[type="button"], input[type="checkbox"], input[type="radio"], [onclick]';
    const cands = Array.from(doc.querySelectorAll(sel)).filter(el => {
      const r = el.getBoundingClientRect();
      return r.width > 0 && r.height > 0;
    });
    if (!cands.length) return false;
    const el = cands[Math.floor(Math.random() * cands.length)];
    if (!el) return false;

    pane.el.classList.remove('flash');
    void pane.el.offsetWidth;
    pane.el.classList.add('flash');
    setTimeout(() => pane.el.classList.remove('flash'), 230);

    const r = el.getBoundingClientRect();
    const opts = { bubbles: true, cancelable: true, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, view: pane.iframe.contentWindow };
    try {
      el.dispatchEvent(new MouseEvent('mousedown', opts));
      el.dispatchEvent(new MouseEvent('mouseup', opts));
    } catch (e) {}
    try { el.click(); } catch (e) {}
    return true;
  } catch (e) { return false; }
}

function activityLoop() {
  if (!state.running) return;
  if (scrollOn.checked) panes.forEach(p => scrollPane(p));
  state.raf = requestAnimationFrame(activityLoop);
}
function scheduleClickForPane(pane) {
  if (!state.running) return;
  const sec = Math.max(1, parseFloat(clickEveryIn.value) || 4);
  const delay = sec * 1000 * (0.6 + Math.random() * 0.8);
  const t = setTimeout(() => {
    if (!state.running) return;
    if (clickOn.checked && !popupMode.checked) tryRandomClick(pane);
    scheduleClickForPane(pane);
  }, delay);
  state.clickTimers.push(t);
}
function startActivities() {
  stopActivities();
  if (popupMode.checked) { toast('En modo popups no hay scroll/click automático'); return; }
  if (scrollOn.checked) state.raf = requestAnimationFrame(activityLoop);
  if (clickOn.checked) panes.forEach(p => scheduleClickForPane(p));
}
function stopActivities() {
  if (state.raf) { cancelAnimationFrame(state.raf); state.raf = null; }
  state.clickTimers.forEach(t => clearTimeout(t));
  state.clickTimers = [];
}

/* =========================================================
   Iniciar / Detener
   ========================================================= */
function startAll() {
  if (!state.url) { toast('Aplica un enlace primero'); return; }
  const limit = Math.max(0, parseInt(limitIn.value, 10) || 0);
  if (limit > 0 && state.cycles >= limit) { toast('Reinicia contadores'); return; }
  if (!manualOnly.checked) {
    const sec = parseFloat(intervalIn.value);
    if (!isFinite(sec) || sec < 1) { toast('Intervalo mínimo 1s'); return; }
    clearInterval(state.timer);
    state.timer = setInterval(() => cycle(false), sec * 1000);
  }
  state.running = true;
  startActivities();
  startBtn.disabled = true;
  stopBtn.disabled = false;
  setStatus(manualOnly.checked ? 'Actividad activa (sin auto-recarga)' : `Activo · cada ${intervalIn.value}s`);
  updateStatusBar();
}
function stopAll() {
  clearInterval(state.timer);
  state.timer = null;
  state.running = false;
  stopActivities();
  startBtn.disabled = false;
  stopBtn.disabled = true;
  setStatus('Detenido');
  updateStatusBar();
}

/* =========================================================
   Aplicar a las 5
   ========================================================= */
function applyToAll() {
  const url = normalizeUrl(urlInput.value);
  if (!url) { toast('Escribe un enlace'); urlInput.focus(); return; }
  urlInput.value = url;
  state.url = url;
  state.cycles = 0;
  state.totalReloads = 0;
  panes.forEach(p => { p.count = 0; updatePaneCount(p); });
  addToHistory(url);

  if (popupMode.checked) {
    openPopups(url);
  } else {
    closePopups();
    panes.forEach((p, i) => setTimeout(() => setPaneUrl(p, buildUrl()), i * 250));
  }
  updateStatusBar();
  setStatus('Enlace aplicado a las 5 ventanas');
  toast('Enlace aplicado a las 5 ventanas');
}

/* =========================================================
   Eventos
   ========================================================= */
applyBtn.addEventListener('click', applyToAll);
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') applyToAll(); });
startBtn.addEventListener('click', startAll);
stopBtn.addEventListener('click', stopAll);
reloadAllBtn.addEventListener('click', () => cycle(true));

resetBtn.addEventListener('click', () => {
  stopAll();
  state.cycles = 0;
  state.totalReloads = 0;
  panes.forEach(p => { p.count = 0; updatePaneCount(p); });
  updateStatusBar();
  setStatus('Contadores reiniciados');
});

manualOnly.addEventListener('change', () => {
  intervalIn.disabled = manualOnly.checked;
  if (manualOnly.checked && state.timer) { clearInterval(state.timer); state.timer = null; }
  else if (!manualOnly.checked && state.running) {
    const sec = parseFloat(intervalIn.value);
    if (sec >= 1) state.timer = setInterval(() => cycle(false), sec * 1000);
  }
});

popupMode.addEventListener('change', () => {
  if (!popupMode.checked) closePopups();
  toast(popupMode.checked ? 'Modo popups: pulsa «Aplicar a las 5»' : 'Modo iframe');
});

sandboxOn.addEventListener('change', () => {
  toast(sandboxOn.checked
    ? 'Sandbox ON: bloquea escapes. Puede romper algunas webs.'
    : 'Sandbox OFF: webs cargan normal. Algunos enlaces externos podrían abrir pestaña.');
});

scrollOn.addEventListener('change', () => {
  updateStatusBar();
  if (state.running && scrollOn.checked && !state.raf) state.raf = requestAnimationFrame(activityLoop);
});

clickOn.addEventListener('change', () => {
  updateStatusBar();
  if (!state.running) return;
  if (clickOn.checked) {
    state.clickTimers.forEach(t => clearTimeout(t));
    state.clickTimers = [];
    panes.forEach(p => scheduleClickForPane(p));
  }
});

window.addEventListener('beforeunload', () => {
  closePopups();
  stopActivities();
});

updateStatusBar();
</script>
</body>
</html>
