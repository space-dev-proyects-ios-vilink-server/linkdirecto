<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Performance Pro · Android Tweaks</title>
<style>
  :root{
    --ink:#f1f4fa;--muted:#8b95aa;--line:#262b36;--line2:#10141a;
    --code-bg:#0b0e14;--code-ink:#e3e9f5;
    --accent:#2f5bff;--accent2:#7c4dff;--ok:#12805c;
    --green:#22c07a;--red:#ef4a5a;--amber:#f5a524;
    --bg:#000;--bg-card:#07090d;--bg-soft:#0b0e14;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%}
  :root{color-scheme:dark}
  body{
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:16px 12px 48px;
    background:
      radial-gradient(1200px 600px at 50% -200px,rgba(47,91,255,.10),transparent 60%),
      radial-gradient(900px 500px at 100% 100%,rgba(124,77,255,.08),transparent 60%),
      #000;
  }
  #lista{max-width:860px;margin:0 auto;display:grid;gap:8px}

  .hero{
    display:flex;align-items:center;gap:14px;
    padding:18px 16px;margin-bottom:6px;
    background:linear-gradient(135deg,rgba(47,91,255,.14),rgba(124,77,255,.08) 60%,transparent);
    border:1px solid var(--line);border-radius:14px;
    position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:-1px;border-radius:14px;padding:1px;
    background:linear-gradient(135deg,rgba(47,91,255,.5),transparent 40%,rgba(124,77,255,.5));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  }
  .hero-logo{
    width:52px;height:52px;flex-shrink:0;display:grid;place-items:center;
    background:linear-gradient(135deg,#2f5bff,#7c4dff);
    border-radius:12px;color:#fff;
    box-shadow:0 8px 24px rgba(47,91,255,.35);
  }
  .hero-logo svg{width:26px;height:26px}
  .hero-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .hero-title{font-size:18px;font-weight:800;letter-spacing:-.01em;color:#fff}
  .hero-sub{font-size:12.5px;color:var(--muted);font-weight:500}

  .stats{display:flex;gap:8px;padding:0 2px 6px;flex-wrap:wrap}
  .stat{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:6px 10px;border-radius:999px;border:1px solid var(--line);
    color:#c6cfde;background:rgba(255,255,255,.02);
  }
  .stat svg{width:13px;height:13px}
  .stat.on{color:#7ef1bf;border-color:rgba(34,192,122,.35)}
  .stat.off{color:#ff97a2;border-color:rgba(239,74,90,.35)}
  .stat.pro{color:#b7c2ff;border-color:rgba(124,77,255,.35)}

  .section-title{
    display:flex;align-items:center;gap:10px;
    padding:22px 4px 10px;margin:10px 0 2px;
    font-size:13px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;
    border-bottom:1px solid var(--line);
  }
  .section-title .s-icon{
    width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;border-radius:8px;
  }
  .section-title .s-icon svg{width:15px;height:15px}
  .section-title.on .s-icon{background:rgba(34,192,122,.14);color:#4ed999}
  .section-title.off .s-icon{background:rgba(239,74,90,.14);color:#ff7a88}
  .section-title.on{color:#c8f7e0}
  .section-title.off{color:#ffd1d6}

  .cat-title{
    display:flex;align-items:center;gap:8px;
    font-size:11.5px;font-weight:700;color:var(--muted);
    letter-spacing:.08em;text-transform:uppercase;margin:16px 4px 6px;
  }
  .cat-title .c-icon{
    width:22px;height:22px;flex-shrink:0;display:grid;place-items:center;
    background:#0e131c;border:1px solid var(--line);border-radius:6px;color:#93a0b8;
  }
  .cat-title .c-icon svg{width:12px;height:12px}
  .cat-title .c-count{
    margin-left:auto;font-size:10.5px;font-weight:600;color:#6d7a90;letter-spacing:.05em;
  }

  .pair{
    background:var(--bg-card);border:1px solid var(--line);border-radius:11px;
    overflow:hidden;transition:border-color .15s;
  }
  .pair:hover{border-color:#31384a}
  .pair + .pair{margin-top:6px}

  .pair-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px 8px 12px;
    background:linear-gradient(180deg,#0b0e14,#090c11);
    border-bottom:1px solid var(--line);
  }
  .pair-name{
    font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:12.5px;font-weight:600;color:#d8dfeb;
    overflow-wrap:anywhere;min-width:0;flex:1 1 auto;
  }
  .pair-head .badge{
    font-size:9.5px;font-weight:800;letter-spacing:.10em;
    padding:3px 7px;border-radius:5px;
    background:linear-gradient(135deg,#2f5bff,#7c4dff);
    color:#fff;flex-shrink:0;
  }

  .info-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;flex-shrink:0;
    background:transparent;border:1px solid var(--line);border-radius:8px;
    color:var(--muted);cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .info-btn:hover{background:#131822;color:var(--ink);border-color:#3a465c}
  .info-btn.active{background:#1a2130;color:var(--ink);border-color:#3a465c}
  .info-btn:focus-visible{outline:3px solid #9db3ff;outline-offset:2px}
  .info-btn svg{width:14px;height:14px}

  .pair-desc{
    padding:10px 12px;background:var(--bg-soft);border-bottom:1px solid var(--line);
    color:#b8c1d1;font-size:12.5px;line-height:1.55;
  }

  .row{
    display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:8px;
    padding:8px 10px;border-bottom:1px solid var(--line2);
  }
  .row:last-child{border-bottom:0}
  .row.on{background:linear-gradient(90deg,rgba(34,192,122,.07),transparent 45%)}
  .row.off{background:linear-gradient(90deg,rgba(239,74,90,.07),transparent 45%)}

  .tag{
    display:inline-flex;align-items:center;justify-content:center;gap:4px;
    font-size:10px;font-weight:800;letter-spacing:.09em;
    padding:5px 6px;border-radius:7px;text-transform:uppercase;
  }
  .tag svg{width:11px;height:11px}
  .tag.on{color:#0b2018;background:linear-gradient(135deg,#22c07a,#1aa364)}
  .tag.off{color:#2a0d12;background:linear-gradient(135deg,#ef4a5a,#c8384a)}

  code.cmd{
    font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:12.5px;line-height:1.55;color:var(--code-ink);
    background:var(--code-bg);border:1px solid #1a1f28;border-radius:7px;
    padding:7px 10px;white-space:pre-wrap;word-break:break-all;
    user-select:all;-webkit-user-select:all;min-width:0;
  }

  .copy-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;flex-shrink:0;
    background:var(--accent);border:0;border-radius:8px;
    color:#fff;cursor:pointer;transition:background .15s,transform .08s;
  }
  .copy-btn:hover{background:#1f45d6}
  .copy-btn:active{transform:scale(.94)}
  .copy-btn:focus-visible{outline:3px solid #9db3ff;outline-offset:2px}
  .copy-btn.done{background:var(--ok)}
  .copy-btn svg{width:16px;height:16px}

  .foot{
    margin-top:24px;padding:14px 16px;
    border:1px solid var(--line);border-radius:12px;
    background:rgba(255,255,255,.02);color:var(--muted);
    font-size:12px;line-height:1.6;display:flex;gap:10px;align-items:flex-start;
  }
  .foot svg{width:16px;height:16px;flex-shrink:0;color:var(--amber);margin-top:2px}
  .foot b{color:#e8edf5}
  .foot code{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    background:#12161f;padding:1px 5px;border-radius:4px;font-size:11.5px;color:#d8dfeb;
  }

  @media (prefers-reduced-motion:reduce){.copy-btn,.info-btn,.pair{transition:none}}
  @media (max-width:520px){
    .row{grid-template-columns:58px 1fr 36px;gap:6px;padding:7px 8px}
    code.cmd{font-size:11.8px;padding:6px 8px}
    .pair-name{font-size:11.5px}
    .hero-title{font-size:16px}
    .hero-logo{width:46px;height:46px}
  }
</style>
</head>

/* ============================================================
   UTILIDADES
   ============================================================ */
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(txt != null) n.textContent = txt;
  return n;
}
function svgSpan(cls, svg){
  var s = el("span", cls);
  s.innerHTML = svg;
  return s;
}
function copiarTexto(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(txt).then(function(){return true;}).catch(function(){return fallback(txt);});
  }
  return Promise.resolve(fallback(txt));
  function fallback(t){
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    var ok=false; try{ok=document.execCommand("copy");}catch(e){}
    ta.remove(); return ok;
  }
}

function crearFila(tipo, cmd){
  var row = el("div", "row " + tipo);

  var tag = el("span", "tag " + tipo);
  tag.innerHTML = (tipo==="on" ? I.zap : I.power) + (tipo==="on" ? "ON" : "OFF");

  var code = el("code", "cmd", cmd);

  var btn = el("button", "copy-btn");
  btn.type = "button";
  btn.setAttribute("aria-label","Copiar comando");
  btn.innerHTML = I.copy;
  btn.addEventListener("click", function(){
    copiarTexto(cmd).then(function(ok){
      if(!ok) return;
      btn.classList.add("done");
      btn.innerHTML = I.check;
      setTimeout(function(){
        btn.classList.remove("done");
        btn.innerHTML = I.copy;
      }, 1400);
    });
  });

  row.appendChild(tag);
  row.appendChild(code);
  row.appendChild(btn);
  return row;
}

function crearPar(item){
  var wrap = el("div", "pair");

  var head = el("div", "pair-head");
  var nombre = el("div", "pair-name", item.name);
  var badge = el("span", "badge", item.lvl || "PRO");

  var infoBtn = el("button", "info-btn");
  infoBtn.type = "button";
  infoBtn.setAttribute("aria-label","Información");
  infoBtn.innerHTML = I.info;

  var desc = el("div", "pair-desc", item.desc || "");
  desc.hidden = true;

  infoBtn.addEventListener("click", function(){
    var abrir = desc.hidden;
    desc.hidden = !abrir;
    infoBtn.classList.toggle("active", abrir);
  });

  head.appendChild(nombre);
  head.appendChild(badge);
  head.appendChild(infoBtn);

  wrap.appendChild(head);
  wrap.appendChild(desc);
  wrap.appendChild(crearFila("on",  item.on));
  wrap.appendChild(crearFila("off", item.off));
  return wrap;
}

/* ============================================================
   RENDER
   ============================================================ */
(function render(){
  var lista = document.getElementById("lista");
  if(!lista) return;

  /* --- HERO --- */
  var hero = el("div", "hero");
  var logo = el("div", "hero-logo"); logo.innerHTML = I.spark;
  var heroTxt = el("div", "hero-txt");
  var heroTitle = el("div", "hero-title", "Performance Pro · Android Tweaks");
  var heroSub = el("div", "hero-sub", DATA.length + " ajustes · activador + desactivador por comando");
  heroTxt.appendChild(heroTitle);
  heroTxt.appendChild(heroSub);
  hero.appendChild(logo);
  hero.appendChild(heroTxt);
  lista.appendChild(hero);

  /* --- STATS --- */
  var cats = {};
  for(var i=0;i<DATA.length;i++){ cats[DATA[i].cat] = true; }
  var nCats = Object.keys(cats).length;

  var stats = el("div", "stats");
  var s1 = el("span", "stat pro"); s1.innerHTML = I.spark + " " + nCats + " categorías";
  var s2 = el("span", "stat on");  s2.innerHTML = I.zap   + " " + DATA.length + " activadores";
  var s3 = el("span", "stat off"); s3.innerHTML = I.power + " " + DATA.length + " resets";
  stats.appendChild(s1);
  stats.appendChild(s2);
  stats.appendChild(s3);
  lista.appendChild(stats);

  /* --- SECTION HEADER ACTIVADORES --- */
  var secOn = el("div", "section-title on");
  var sOnIcon = el("span", "s-icon"); sOnIcon.innerHTML = I.zap;
  var sOnTxt = el("span", null, "Activadores");
  secOn.appendChild(sOnIcon);
  secOn.appendChild(sOnTxt);
  lista.appendChild(secOn);

  /* --- ITER DATA --- */
  var catActual = null;
  for(var k=0;k<DATA.length;k++){
    var item = DATA[k];
    if(item.cat !== catActual){
      catActual = item.cat;
      var ct = el("div", "cat-title");
      var cIcon = el("span","c-icon"); cIcon.innerHTML = I[item.icon] || I.cog;
      var cName = el("span", null, catActual);
      var cCount = el("span","c-count", String(DATA.filter(function(d){return d.cat===catActual;}).length));
      ct.appendChild(cIcon);
      ct.appendChild(cName);
      ct.appendChild(cCount);
      lista.appendChild(ct);
    }
    lista.appendChild(crearPar(item));
  }

  /* --- SECTION HEADER DESACTIVADORES (referencia visual) --- */
  var secOff = el("div", "section-title off");
  var sOffIcon = el("span","s-icon"); sOffIcon.innerHTML = I.power;
  var sOffTxt = el("span", null, "Desactivadores (usa el botón OFF de cada par)");
  secOff.appendChild(sOffIcon);
  secOff.appendChild(sOffTxt);
  lista.appendChild(secOff);

  var infoBox = el("div", "foot");
  infoBox.innerHTML = I.alert + '<div><b>Nota:</b> cada tarjeta contiene el comando <b>ON</b> (activar) y el <b>OFF</b> (reset). Copia el que necesites. Los cambios en <code>settings</code> y <code>persist.*</code> sobreviven reinicios; los de <code>/proc</code> y <code>/sys</code> se reinician al apagar. Algunos valores pueden no existir en tu kernel: si un comando falla, simplemente no tiene efecto.</div>';
  lista.appendChild(infoBox);
})();
</script>
