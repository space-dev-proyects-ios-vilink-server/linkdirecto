<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8203;</title>
<style>
  :root {
    --ink: #f1f4fa;
    --muted: #8b95aa;
    --line: #262b36;
    --code-bg: #0f1218;
    --code-ink: #e3e9f5;
    --accent: #2f5bff;
    --ok: #12805c;
    --green: #22c07a;
    --red: #ef4a5a;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; background: #000; color: var(--ink); min-height: 100%; }
  :root { color-scheme: dark; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 40px;
  }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 12px; }

  .section-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 16px 4px 6px;
    margin: 4px 0 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before {
    content: "";
    width: 6px; height: 18px; border-radius: 3px;
    background: var(--accent);
  }
  .section-title.on::before  { background: var(--green); }
  .section-title.off::before { background: var(--red); }

  .slot {
    background: #07090d;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .slot-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 8px 8px 14px;
    border-bottom: 1px solid var(--line);
    min-height: 48px;
  }
  .slot-title {
    font-size: 14px; font-weight: 600; color: var(--ink);
    overflow-wrap: anywhere; flex: 1 1 auto; min-width: 0;
  }
  .slot-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

  .info-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; flex-shrink: 0;
    background: transparent; border: 1px solid var(--line);
    border-radius: 8px; color: var(--muted); cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .info-btn:hover { background: #131822; color: var(--ink); }
  .info-btn:focus-visible { outline: 3px solid #9db3ff; outline-offset: 2px; }
  .info-btn.active { background: #1a2130; color: var(--ink); border-color: #3a465c; }
  .info-btn svg { width: 20px; height: 20px; }

  .slot-desc {
    padding: 12px 14px;
    background: #0a0d13;
    border-bottom: 1px solid var(--line);
    color: #b8c1d1;
    font-size: 13px;
    line-height: 1.55;
  }

  .copy-btn {
    display: inline-flex; align-items: center; gap: 8px;
    font: inherit; font-size: 14px; font-weight: 600;
    color: #fff; background: var(--accent);
    border: 0; border-radius: 8px;
    padding: 10px 14px; min-height: 40px;
    cursor: pointer; flex-shrink: 0;
    transition: background .15s;
  }
  .copy-btn:hover { background: #1f45d6; }
  .copy-btn:focus-visible { outline: 3px solid #9db3ff; outline-offset: 2px; }
  .copy-btn.done { background: var(--ok); }
  .copy-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .copy-btn[disabled] { background: #2a303c; color: #6b7587; cursor: default; }

  pre.code {
    margin: 0;
    padding: 14px;
    background: var(--code-bg);
    color: var(--code-ink);
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.6;
    white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 320px; overflow: auto;
    user-select: all; -webkit-user-select: all;
    min-height: 64px;
  }
  pre.code.empty {
    color: #7c869b; user-select: none; -webkit-user-select: none;
    display: flex; align-items: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .copy-btn, .info-btn { transition: none; }
  }
</style>
</head>
<body>
<main id="lista"></main>

<!-- ============================================================
     ⚙️  SCRIPT INDIVIDUAL POR FUNCIÓN
     data-seccion → "Activadores" o "Desactivadores"
     data-titulo  → título visible
     data-desc    → texto del botón ⓘ
     ============================================================ -->

     🟢  SECCIÓN ACTIVADORES

<!-- 1 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="1 · Tasa de Muestreo Táctil ↑"
  data-desc="Sube la tasa de muestreo del panel táctil de 60 Hz a 2000 Hz. Reduce la latencia del tacto y hace que los toques se registren más rápido. Muy útil en juegos de disparos o ritmo.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
for t in /sys/class/input/input*/device/device/; do
    [ -f "$t/sampling_rate" ] && echo "1000" > "$t/sampling_rate"
done
settings put system touch.sampling_rate 2000
settings put system touch.sampling_duration 0.5
settings put system touch.sampling_period 0
settings put system touch.boost_duration 5000
setprop debug.touch.sampling_rate 2000
echo "OK: muestreo táctil ↑"
</script>

<!-- 2 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="2 · Sensibilidad y Presión Táctil ↑"
  data-desc="Reduce la presión mínima necesaria para registrar un toque y ajusta la escala de tamaño. Hace que la pantalla responda a toques muy ligeros, ideal para juegos con controles rápidos.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
for t in /sys/class/input/input*/device/device/; do
    [ -f "$t/pressure_scale" ] && echo "0.001" > "$t/pressure_scale"
    [ -f "$t/size_scale" ] && echo "0.5" > "$t/size_scale"
done
settings put system touch.pressure.scale 0.0001
settings put system touch.size.scale 0.3
settings put system touch.min_pressure 0.001
settings put system touch.max_pressure 1.5
settings put system touch.size.calibration geometric
settings put system touch.size.bias 0.05
settings put system touch.size.isSummed 0
settings put system touch.orientation.calibration matrix
settings put system touch.distance.calibration precise
settings put system touch.coverage.calibration octagram
setprop debug.touch.pressure.scale 0.0001
setprop debug.touch.size.scale 0.3
echo "OK: sensibilidad táctil ↑"
</script>

<!-- 3 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="3 · Filtros Táctiles OFF"
  data-desc="Desactiva los filtros y gestos del driver táctil. Elimina el suavizado artificial que añade latencia. Los toques se sienten más crudos y directos.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
for t in /sys/class/input/input*/device/device/; do
    [ -f "$t/filter" ] && echo "0" > "$t/filter"
    [ -f "$t/report_gesture" ] && echo "0" > "$t/report_gesture"
done
settings put system touch.motion.filter none
settings put system touch.motion.speed 15
settings put system touch.motion.scale 0.05
settings put system touch.motion.threshold 0
settings put system game_disable_touch_filter 1
echo "OK: filtros táctiles OFF"
</script>

<!-- 4 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="4 · Tracking y Slop Táctil"
  data-desc="Ajusta el seguimiento del dedo y el umbral de desplazamiento (slop). Hace que el sistema interprete mejor los movimientos rápidos y reduzca falsos toques.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
settings put system touch.tracking.speed 15
settings put system touch.tracking.size 2
settings put system touch.tracking.pressure 6
settings put system touch.touchSlop 1
settings put system touch.doubleTapSlop 1
settings put system touch.gestureMode spots
echo "OK: tracking táctil ajustado"
</script>

<!-- 5 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="5 · Predicción Táctil (IA)"
  data-desc="Activa la predicción táctil del sistema: anticipa dónde vas a tocar antes de que el dedo llegue. Reduce la latencia percibida y mejora la respuesta en juegos.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
settings put secure touch_prediction_enabled 1
settings put secure touch_prediction_duration 0.05
settings put secure touch_prediction_offset 0.02
settings put secure touch_palm_rejection 4
settings put secure touch_block_duration 0
settings put secure touch_jump_filtering 0
echo "OK: predicción táctil activada"
</script>

<!-- 6 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="6 · Gobernador CPU = Performance"
  data-desc="Fuerza el gobernador de CPU a 'performance'. Mantiene los núcleos siempre a la frecuencia máxima, eliminando el retardo de subida de frecuencia. Aumenta consumo y calor.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
for c in /sys/devices/system/cpu/cpu*/cpufreq/; do
    [ -f "$c/scaling_governor" ] && echo "performance" > "$c/scaling_governor"
done
echo "OK: gobernador CPU = performance"
</script>

<!-- 7 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="7 · Frecuencia CPU al Máximo"
  data-desc="Fija la frecuencia mínima y máxima de todos los núcleos al valor más alto soportado por el chip. Evita bajadas de frecuencia en momentos críticos.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
for c in /sys/devices/system/cpu/cpu*/cpufreq/; do
    [ -f "$c/scaling_min_freq" ] && echo "$(cat ${c}cpuinfo_max_freq)" > "$c/scaling_min_freq"
    [ -f "$c/scaling_max_freq" ] && echo "$(cat ${c}cpuinfo_max_freq)" > "$c/scaling_max_freq"
done
echo "OK: CPU fijada a frecuencia máxima"
</script>

<!-- 8 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="8 · GPU Adreno Performance"
  data-desc="Fuerza la GPU Qualcomm Adreno al gobernador 'performance' y desactiva el ahorro de energía. Mejora los FPS estables en juegos 3D.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
[ -f /sys/class/kgsl/kgsl-3d0/devfreq/governor ] && echo "performance" > /sys/class/kgsl/kgsl-3d0/devfreq/governor
[ -f /sys/class/kgsl/kgsl-3d0/bus_split ] && echo 0 > /sys/class/kgsl/kgsl-3d0/bus_split
[ -f /sys/class/kgsl/kgsl-3d0/force_clk_on ] && echo 1 > /sys/class/kgsl/kgsl-3d0/force_clk_on
[ -f /sys/class/kgsl/kgsl-3d0/idle_timer ] && echo 10000 > /sys/class/kgsl/kgsl-3d0/idle_timer
echo "OK: GPU performance"
</script>

<!-- 9 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="9 · Scheduler Baja Latencia"
  data-desc="Ajusta el planificador del kernel para dar prioridad a tareas interactivas. Reduce el tiempo entre que tocas y el sistema responde.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
echo 0 > /proc/sys/kernel/sched_child_runs_first
echo 1 > /proc/sys/kernel/sched_autogroup_enabled
echo 1000000 > /proc/sys/kernel/sched_latency_ns
echo 100000 > /proc/sys/kernel/sched_min_granularity_ns
echo 500000 > /proc/sys/kernel/sched_wakeup_granularity_ns
echo "OK: scheduler baja latencia"
</script>

<!-- 10 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="10 · Memoria Virtual (VM)"
  data-desc="Desactiva el swap y ajusta la gestión de memoria para mantener todo en RAM. Reduce los tirones por escritura a disco.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
echo 0 > /proc/sys/vm/swappiness
echo 50 > /proc/sys/vm/vfs_cache_pressure
echo 256 > /proc/sys/vm/min_free_kbytes
echo 1 > /proc/sys/vm/overcommit_memory
echo 80 > /proc/sys/vm/overcommit_ratio
echo 10 > /proc/sys/vm/dirty_ratio
echo 5 > /proc/sys/vm/dirty_background_ratio
echo 500 > /proc/sys/vm/dirty_expire_centisecs
echo 100 > /proc/sys/vm/dirty_writeback_centisecs
echo "OK: VM ajustada"
</script>

<!-- 11 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="11 · I/O Scheduler = noop"
  data-desc="Cambia el planificador de disco a 'noop' y aumenta la lectura anticipada. Reduce la sobrecarga del almacenamiento y mejora la carga de datos.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
for i in /sys/block/*/queue; do
    echo "noop" > $i/scheduler 2>/dev/null
    echo 0 > $i/add_random 2>/dev/null
    echo 0 > $i/iostats 2>/dev/null
    echo 256 > $i/nr_requests 2>/dev/null
    echo 2048 > $i/read_ahead_kb 2>/dev/null
done
echo "OK: I/O scheduler noop"
</script>

<!-- 12 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="12 · Red TCP Baja Latencia"
  data-desc="Optimiza la pila TCP/IP: desactiva timestamps, activa reutilización de sockets y ajusta buffers. Reduce el ping en juegos online.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
setprop net.tcp.buffersize.default 4096,87380,256960,4096,16384,256960
setprop net.tcp.buffersize.wifi 4096,87380,256960,4096,16384,256960
echo 0 > /proc/sys/net/ipv4/tcp_timestamps
echo 1 > /proc/sys/net/ipv4/tcp_tw_reuse
echo 1 > /proc/sys/net/ipv4/tcp_sack
echo 1 > /proc/sys/net/ipv4/tcp_dsack
echo 1 > /proc/sys/net/ipv4/tcp_window_scaling
echo 3 > /proc/sys/net/ipv4/tcp_keepalive_probes
echo 20 > /proc/sys/net/ipv4/tcp_keepalive_intvl
echo 15 > /proc/sys/net/ipv4/tcp_fin_timeout
echo "OK: red optimizada"
</script>

<!-- 13 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="13 · Thermal / Throttling OFF"
  data-desc="Desactiva la gestión térmica del kernel (msm_thermal). Evita que el sistema baje la frecuencia por calor. ¡Cuidado: el dispositivo puede calentarse mucho!">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
for t in /sys/class/thermal/thermal_zone*/; do
    [ -f "$t/mode" ] && echo "disabled" > "$t/mode"
    [ -f "$t/policy" ] && echo "0" > "$t/policy"
done
[ -f /sys/module/msm_thermal/parameters/enabled ] && echo N > /sys/module/msm_thermal/parameters/enabled
[ -f /sys/module/msm_thermal/core_control/enabled ] && echo 0 > /sys/module/msm_thermal/core_control/enabled
echo "OK: thermal OFF"
</script>

<!-- 14 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="14 · Composición GPU (SurfaceFlinger)"
  data-desc="Fuerza la composición por GPU y desactiva vsync. Reduce la carga del CPU en gráficos y aumenta la tasa de frames.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
setprop debug.egl.swapinterval 0
setprop debug.sf.latch_unsignaled 1
setprop debug.sf.enable_gl_backpressure 0
setprop debug.sf.hw 1
setprop debug.egl.hw 1
setprop debug.composition.type gpu
echo "OK: composición GPU"
</script>

<!-- 15 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="15 · HWUI / UI Rendering"
  data-desc="Optimiza la capa de renderizado de la interfaz (HWUI). Desactiva vsync y aumenta el caché de texturas. Interfaz más fluida.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
setprop debug.hwui.renderer opengl
setprop debug.hwui.profile true
setprop debug.hwui.overdraw false
setprop debug.hwui.disable_vsync true
setprop debug.hwui.empty_frame_rate 144
setprop debug.hwui.texture_cache_size 512
echo "OK: HWUI optimizado"
</script>

<!-- 16 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="16 · Refresh Rate Alto (120 / 144 Hz)"
  data-desc="Fija la tasa de refresco mínima y máxima a 120 Hz (o 144 Hz). Evita que el sistema baje a 60 Hz para ahorrar batería.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
setprop debug.refresh_rate.min_fps 120
setprop debug.peak_refresh_rate 120
setprop debug.min_refresh_rate 120
setprop debug.max_refresh_rate 120
setprop debug.lock_refresh_rate 120
setprop debug.sf.frame_rate_multiple_threshold 144
echo "OK: refresh rate fijado"
</script>

<!-- 17 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="17 · Gaming Mode Extremo"
  data-desc="Activa todos los modos de juego del sistema: touch boost, respuesta rápida, precisión alta, high performance. Se combina con los persist.sys.* de prioridad.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
settings put system gaming_mode_enabled 2
settings put system game_touch_boost 2
settings put system game_touch_response 0.005
settings put system game_touch_precision 15
settings put system game_disable_touch_filter 1
settings put system game_high_performance_mode 1
setprop persist.sys.power_profile extreme
setprop persist.sys.performance true
setprop persist.sys.cpu_boost 2
setprop persist.sys.gpu_boost 2
setprop persist.sys.io_boost 1
setprop persist.sys.touch_boost 3
echo "OK: gaming mode extremo"
</script>

<!-- 18 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="18 · Debug / Seguridad (Performance)"
  data-desc="Desactiva la protección de rendimiento, pone SELinux en permisivo y activa tuning de performance. Solo para uso con root, baja la seguridad del sistema.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
setprop security.perf_harden 0
setprop security.adb.notify 0
setprop security.selinux permissive
setprop security.mdf.result none
setprop security.aslr.disable 1
setprop debug.performance.tuning 1
setprop debug.performance_schema 1
echo "OK: debug/seguridad ajustado"
</script>

<!-- 19 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="19 · Power / Fast Charge"
  data-desc="Activa el modo de rendimiento fijo del sistema y la carga rápida forzada. El dispositivo no bajará frecuencias al cargar.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
cmd power set-fixed-performance-mode-enabled true
[ -f /sys/kernel/fast_charge/force_fast_charge ] && echo 1 > /sys/kernel/fast_charge/force_fast_charge
echo "OK: power performance"
</script>

<!-- 20 -->
<script type="text/plain" class="sh"
  data-seccion="Activadores"
  data-titulo="20 · Limpieza de Caché (One-Shot)"
  data-desc="Libera memoria RAM, mata procesos en segundo plano, limpia caché y aplica TRIM al almacenamiento. Ejecútalo antes de jugar para tener todo fresco.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
sync
echo 3 > /proc/sys/vm/drop_caches
am kill-all
pm trim-caches 99999999999999
fstrim -v /data 2>/dev/null
fstrim -v /cache 2>/dev/null
echo "OK: caché limpiada"
</script>

<!-- 1 -->
<script type="text/plain" class="sh"
  data-seccion="Desactivadores"
  data-titulo="1 · Tasa de Muestreo Táctil → Reset"
  data-desc="Devuelve la tasa de muestreo táctil a los 60 Hz de fábrica y borra los ajustes personalizados del sistema.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
for t in /sys/class/input/input*/device/device/; do
    [ -f "$t/sampling_rate" ] && echo "60" > "$t/sampling_rate"
done
settings delete system touch.sampling_rate
settings delete system touch.sampling_duration
settings delete system touch.sampling_period
settings delete system touch.boost_duration
setprop debug.touch.sampling_rate ""
echo "OK: muestreo táctil reset"
</script>

<!-- 2 -->
<script type="text/plain" class="sh"
  data-seccion="Desactivadores"
  data-titulo="2 · Sensibilidad y Presión → Reset"
  data-desc="Restaura la presión y tamaño táctil a valores de fábrica y elimina todas las calibraciones personalizadas.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
for t in /sys/class/input/input*/device/device/; do
    [ -f "$t/pressure_scale" ] && echo "1.0" > "$t/pressure_scale"
    [ -f "$t/size_scale" ] && echo "1.0" > "$t/size_scale"
done
settings delete system touch.pressure.scale
settings delete system touch.size.scale
settings delete system touch.min_pressure
settings delete system touch.max_pressure
settings delete system touch.size.calibration
settings delete system touch.size.bias
settings delete system touch.size.isSummed
settings delete system touch.orientation.calibration
settings delete system touch.distance.calibration
settings delete system touch.coverage.calibration
setprop debug.touch.pressure.scale ""
setprop debug.touch.size.scale ""
setprop debug.touch.orientation.calibration ""
echo "OK: sensibilidad táctil reset"
</script>

<!-- 3 -->
<script type="text/plain" class="sh"
  data-seccion="Desactivadores"
  data-titulo="3 · Filtros Táctiles → Reset"
  data-desc="Reactiva el filtro del driver y los gestos por defecto, y elimina los ajustes de filtrado del sistema.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
for t in /sys/class/input/input*/device/device/; do
    [ -f "$t/filter" ] && echo "1" > "$t/filter"
    [ -f "$t/report_gesture" ] && echo "1" > "$t/report_gesture"
done
settings delete system touch.motion.filter
settings delete system touch.motion.speed
settings delete system touch.motion.scale
settings delete system touch.motion.threshold
settings delete system game_disable_touch_filter
echo "OK: filtros táctiles reset"
</script>

<!-- 4 -->
<script type="text/plain" class="sh"
  data-seccion="Desactivadores"
  data-titulo="4 · Tracking y Slop → Reset"
  data-desc="Devuelve los parámetros de tracking y slop a sus valores originales del sistema.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
settings delete system touch.tracking.speed
settings delete system touch.tracking.size
settings delete system touch.tracking.pressure
settings delete system touch.touchSlop

<script type="text/plain" class="sh"
  data-seccion="Desactivadores"
  data-titulo="7 · Frecuencia CPU → Reset"

#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }

<script type="text/plain" class="sh"

  data-titulo="8 · GPU Adreno → Reset"

#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
[ -f /sys/class/kgsl/kgsl-3d0/devfreq/governor ] && echo "msm-adreno-tz" > /sys/class/kgsl/kgsl-3d0/devfreq/governor
[ -f /sys/class/kgsl/kgsl-3d0/bus_split ] && echo 1 > /sys/class/kgsl/kgsl-3d0/bus_split
[ -f /sys/class/kgsl/kgsl-3d0/force_clk_on ] && echo 0 > /sys/class/kgsl/kgsl-3d0/force_clk_on
[ -f /sys/class/kgsl/kgsl-3d0/idle_timer ] && echo 1000 > /sys/class/kgsl/kgsl-3d0/idle_timer
echo "OK: GPU reset"
</script>

<script type="text/plain" class="sh"
  data-seccion="Desactivadores"
  data-titulo="9 · Scheduler → Reset"
  data-desc="Devuelve los parámetros del scheduler del kernel a los valores por defecto de fábrica.">

echo 1 > /proc/sys/kernel/sched_child_runs_first
echo 0 > /proc/sys/kernel/sched_autogroup_enabled
echo 24000000 > /proc/sys/kernel/sched_latency_ns
echo 3000000 > /proc/sys/kernel/sched_min_granularity_ns
echo 4000000 > /proc/sys/kernel/sched_wakeup_granularity_ns
echo "OK: scheduler reset"
</script>

<!-- 10 -->
<script type="text/plain" class="sh"
  data-seccion="Desactivadores"
  data-titulo="10 · Memoria VM → Reset"
  data-desc="Restaura swappiness, cache_pressure y ratios de memoria a los valores originales de Android.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
echo 60 > /proc/sys/vm/swappiness
echo 100 > /proc/sys/vm/vfs_cache_pressure
echo 8192 > /proc/sys/vm/min_free_kbytes
echo 0 > /proc/sys/vm/overcommit_memory
echo 50 > /proc/sys/vm/overcommit_ratio
echo 20 > /proc/sys/vm/dirty_ratio
echo 10 > /proc/sys/vm/dirty_background_ratio
echo "OK: VM reset"
</script>

<!-- 11 -->
<script type="text/plain" class="sh"
  data-seccion="Desactivadores"
  data-titulo="11 · I/O Scheduler → Reset"
  data-desc="Devuelve el planificador de disco a 'cfq' con valores por defecto del sistema.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
for i in /sys/block/*/queue; do
    echo "cfq" > $i/scheduler 2>/dev/null
    echo 1 > $i/add_random 2>/dev/null
    echo 1 > $i/iostats 2>/dev/null
    echo 128 > $i/nr_requests 2>/dev/null
    echo 128 > $i/read_ahead_kb 2>/dev/null
done
echo "OK: I/O reset"
</script>

echo 1 > /proc/sys/net/ipv4/tcp_sack
echo 1 > /proc/sys/net/ipv4/tcp_window_scaling
echo 9 > /proc/sys/net/ipv4/tcp_keepalive_probes
echo 75 > /proc/sys/net/ipv4/tcp_keepalive_intvl

echo "OK: red reset"
</script>

  data-titulo="13 · Thermal → Reset"
  data-desc="Vuelve a activar la gestión térmica del kernel. El dispositivo limitará el rendimiento si se calienta para proteger el hardware.">
#!/system/bin/sh
[ "$(id -u)" -ne 0 ] && { echo "Root requerido"; exit 1; }
for t in /sys/class/thermal/thermal_zone*/; do
    [ -f "$t/mode" ] && echo "enabled" > "$t/mode"
    [ -f "$t/policy" ] && echo "step_wise" > "$t/policy"
done
[ -f /sys/module/msm_thermal/parameters/enabled ] && echo Y > /sys/module/msm_thermal/parameters/enabled
[ -f /sys/module/msm_thermal/core_control/enabled ] && echo 1 > /sys/module/msm_thermal/core_control/enabled
echo "OK: thermal reset"
</script>

<script>
const ICONO_COPIAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
const ICONO_OK     = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const ICONO_INFO   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';

async function copiarTexto(texto) {
  try {
    await navigator.clipboard.writeText(texto);
    return true;
  } catch (e) {
    const t = document.createElement("textarea");
    t.value = texto;
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.appendChild(t);
    t.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) {}
    t.remove();
    return ok;
  }
}

const lista = document.getElementById("lista");

// Agrupar scripts por sección preservando el orden
const grupos = new Map();
document.querySelectorAll("script.sh").forEach((fuente) => {
  const sec = fuente.getAttribute("data-seccion") || "";
  if (!grupos.has(sec)) grupos.set(sec, []);
  grupos.get(sec).push(fuente);
});

function crearSlot(fuente) {
  const codigo  = fuente.textContent.replace(/^(\r?\n)+/, "").replace(/\s+$/, "");
  const tituloTxt = fuente.getAttribute("data-titulo") || "";
  const descTxt   = fuente.getAttribute("data-desc")   || "";
  const vacio = codigo === "";

  const slot = document.createElement("section");
  slot.className = "slot";

  const head = document.createElement("div");
  head.className = "slot-head";

  const titulo = document.createElement("div");
  titulo.className = "slot-title" + (tituloTxt ? "" : " empty");
  titulo.textContent = tituloTxt;

  const acciones = document.createElement("div");
  acciones.className = "slot-actions";

  let panelDesc = null;
  if (descTxt) {
    const infoBtn = document.createElement("button");
    infoBtn.type = "button";
    infoBtn.className = "info-btn";
    infoBtn.setAttribute("aria-label", "Mostrar información");
    infoBtn.setAttribute("aria-expanded", "false");
    infoBtn.innerHTML = ICONO_INFO;

    panelDesc = document.createElement("div");
    panelDesc.className = "slot-desc";
    panelDesc.hidden = true;
    panelDesc.textContent = descTxt;

    infoBtn.addEventListener("click", () => {
      const abrir = panelDesc.hidden;
      panelDesc.hidden = !abrir;
      infoBtn.classList.toggle("active", abrir);
      infoBtn.setAttribute("aria-expanded", String(abrir));
    });

    acciones.appendChild(infoBtn);
  }

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "copy-btn";
  btn.innerHTML = ICONO_COPIAR + "<span>Copiar</span>";
  btn.disabled = vacio;

  btn.addEventListener("click", async () => {
    const ok = await copiarTexto(codigo);
    if (!ok) return;
    btn.classList.add("done");
    btn.innerHTML = ICONO_OK + "<span>Copiado</span>";
    setTimeout(() => {
      btn.classList.remove("done");
      btn.innerHTML = ICONO_COPIAR + "<span>Copiar</span>";
    }, 1800);
  });

  acciones.appendChild(btn);

  const pre = document.createElement("pre");
  pre.className = "code" + (vacio ? " empty" : "");
  pre.textContent = vacio ? "Espacio disponible" : codigo;

  head.append(titulo, acciones);
  slot.append(head);
  if (panelDesc) slot.append(panelDesc);
  slot.append(pre);
  return slot;
}

grupos.forEach((scripts, seccion) => {
  if (seccion) {
    const h = document.createElement("h2");
    h.className = "section-title " + (seccion === "Activadores" ? "on" : "off");
    h.textContent = (seccion === "Activadores" ? "🟢 " : "🔴 ") + seccion;
    lista.appendChild(h);
  }
  scripts.forEach((f) => lista.appendChild(crearSlot(f)));
});
</script>
