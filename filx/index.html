<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8203;</title>
<style>
  :root {
    --ink:#f1f4fa; --muted:#8b95aa; --line:#262b36;
    --code-bg:#0f1218; --code-ink:#e3e9f5;
    --accent:#2f5bff; --ok:#12805c;
    --green:#22c07a; --red:#ef4a5a;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;background:#000;color:var(--ink);min-height:100%}
  :root{color-scheme:dark}
  body{
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:16px 12px 40px;
  }
  main{max-width:820px;margin:0 auto;display:grid;gap:8px}

  .section-title{
    font-size:15px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;
    padding:18px 4px 8px;margin:8px 0 2px;
    display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line);
  }
  .section-title::before{
    content:"";width:6px;height:18px;border-radius:3px;background:var(--accent);
  }
  .section-title.on::before{background:var(--green)}
  .section-title.off::before{background:var(--red)}

  .cat-title{
    font-size:12px;font-weight:700;color:var(--muted);
    letter-spacing:.06em;text-transform:uppercase;
    margin:14px 4px 2px;
  }

  /* Par de scripts: activador + desactivador */
  .pair{
    background:#07090d;border:1px solid var(--line);
    border-radius:10px;overflow:hidden;
    display:grid;gap:0;
  }
  .pair + .pair{margin-top:6px}

  .pair-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:6px 10px;
    background:#0b0e14;
    border-bottom:1px solid var(--line);
  }
  .pair-name{
    font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:12.5px;font-weight:600;color:#cfd6e3;
    overflow-wrap:anywhere;
  }
  .info-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;flex-shrink:0;
    background:transparent;border:1px solid var(--line);border-radius:8px;
    color:var(--muted);cursor:pointer;
  }
  .info-btn:hover{background:#131822;color:var(--ink)}
  .info-btn.active{background:#1a2130;color:var(--ink);border-color:#3a465c}
  .info-btn svg{width:16px;height:16px}

  .pair-desc{
    padding:10px 12px;background:#0a0d13;border-bottom:1px solid var(--line);
    color:#b8c1d1;font-size:12.5px;line-height:1.5;
  }

  .row{
    display:grid;
    grid-template-columns:64px 1fr 40px;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    border-bottom:1px solid #14181f;
  }
  .row:last-child{border-bottom:0}
  .row.on {background:linear-gradient(90deg,rgba(34,192,122,.06),transparent 40%)}
  .row.off{background:linear-gradient(90deg,rgba(239,74,90,.06),transparent 40%)}

  .tag{
    font-size:10.5px;font-weight:800;letter-spacing:.08em;
    text-align:center;padding:4px 6px;border-radius:6px;
  }
  .tag.on {color:#0b2018;background:var(--green)}
  .tag.off{color:#2a0d12;background:var(--red)}

  code.cmd{
    font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:12.5px;line-height:1.5;
    color:var(--code-ink);
    background:var(--code-bg);
    border:1px solid #1a1f28;
    border-radius:6px;
    padding:6px 9px;
    white-space:pre-wrap;word-break:break-all;
    user-select:all;-webkit-user-select:all;
  }

  .copy-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;
    background:var(--accent);border:0;border-radius:8px;
    color:#fff;cursor:pointer;
    transition:background .15s;
  }
  .copy-btn:hover{background:#1f45d6}
  .copy-btn:focus-visible{outline:3px solid #9db3ff;outline-offset:2px}
  .copy-btn.done{background:var(--ok)}
  .copy-btn svg{width:16px;height:16px}

  @media (prefers-reduced-motion:reduce){.copy-btn,.info-btn{transition:none}}
  @media (max-width:480px){
    .row{grid-template-columns:54px 1fr 36px;gap:6px;padding:7px 8px}
    code.cmd{font-size:12px;padding:5px 7px}
    .pair-name{font-size:12px}
  }
</style>
</head>

const ICO_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
const ICO_OK   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const ICO_INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';

async function copiar(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    const t=document.createElement("textarea");
    t.value=txt; t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select();
    let ok=false; try{ok=document.execCommand("copy");}catch(_){}
    t.remove(); return ok;
  }
}

const lista = document.getElementById("lista");

function crearPar(item){
  const wrap = document.createElement("div");
  wrap.className = "pair";

  /* head */
  const head = document.createElement("div");
  head.className = "pair-head";

  const nombre = document.createElement("div");
  nombre.className = "pair-name";
  nombre.textContent = item.name;

  const infoBtn = document.createElement("button");
  infoBtn.type = "button";
  infoBtn.className = "info-btn";
  infoBtn.setAttribute("aria-label","Información");
  infoBtn.innerHTML = ICO_INFO;

  const desc = document.createElement("div");
  desc.className = "pair-desc";
  desc.hidden = true;
  desc.textContent = item.desc || "";

  infoBtn.addEventListener("click", () => {
    const abrir = desc.hidden;
    desc.hidden = !abrir;
    infoBtn.classList.toggle("active", abrir);
  });

  head.append(nombre, infoBtn);
  wrap.append(head, desc);

  /* fila activador */
  wrap.appendChild(crearFila("on","ACTIVAR", item.on));
  /* fila desactivador */
  wrap.appendChild(crearFila("off","RESET", item.off));

  return wrap;
}

function crearFila(tipo, tagTxt, cmd){
  const row = document.createElement("div");
  row.className = "row " + tipo;

  const tag = document.createElement("span");
  tag.className = "tag " + tipo;
  tag.textContent = tagTxt;

  const code = document.createElement("code");
  code.className = "cmd";
  code.textContent = cmd;

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "copy-btn";
  btn.setAttribute("aria-label","Copiar comando");
  btn.innerHTML = ICO_COPY;

  btn.addEventListener("click", async () => {
    const ok = await copiar(cmd);
    if(!ok) return;
    btn.classList.add("done");
    btn.innerHTML = ICO_OK;
    setTimeout(()=>{ btn.classList.remove("done"); btn.innerHTML=ICO_COPY; }, 1500);
  });

  row.append(tag, code, btn);
  return row;
}

/* ---------- Render: agrupar por categoría, respetando orden ---------- */
function render(){
  const h = document.createElement("h2");
  h.className = "section-title";
  h.innerHTML = "Scripts individuales (activador + desactivador por función)";
  h.style.color = "#8b95aa";
  h.style.fontSize = "13px";
  h.style.textTransform = "none";
  h.style.letterSpacing = "0";
  h.style.fontWeight = "500";
  lista.appendChild(h);

  let catActual = null;
  DATA.forEach(item => {
    if(item.cat !== catActual){
      catActual = item.cat;
      const ct = document.createElement("div");
      ct.className = "cat-title";
      ct.textContent = catActual;
      lista.appendChild(ct);
    }
    lista.appendChild(crearPar(item));
  });
}

render();
</script>
