<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel en actualización</title>
  <style>
    /* Reseteo básico y fondo negro total */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;    /* Fondo negro */
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Contenedor del mensaje */
    .mensaje {
      color: #ffffff;               /* Texto blanco */
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      padding: 1.5rem 2rem;
      max-width: 90%;
      line-height: 1.4;
      background: transparent;      /* sin fondo adicional */
      border: none;
      box-shadow: none;
    }

    /* Pequeño ajuste para móviles */
    @media (max-width: 600px) {
      .mensaje {
        font-size: 1.6rem;
        padding: 1rem 1.2rem;
      }
    }

    /* Estilo sutil para el texto (opcional, solo para darle un toque limpio) */
    .mensaje span {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="mensaje">
    este panel aún se está actualizando, por favor espere aviso
  </div>
</body>
</html>
