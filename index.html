<style>
  /* ── TOKENS ─────────────────────────────────────────── */
  :root{
    --ink:        #0B1729;
    --ink-2:      #33445C;
    --muted:      #7C8CA3;
    --muted-2:    #A2AFC3;

    --line:       #E8EEF7;
    --line-2:     #D6E3F5;

    --blue-700:   #1D4ED8;
    --blue-600:   #2563EB;
    --blue-500:   #3B82F6;
    --blue-400:   #60A5FA;
    --blue-100:   #DBEAFE;
    --blue-50:    #EFF5FF;

    --grad:       linear-gradient(140deg,#2563EB 0%,#60A5FA 100%);

    --r:          16px;
    --ease:       cubic-bezier(.22,.61,.36,1);
  }

  /* ── RESET ──────────────────────────────────────────── */
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }

  body{
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink);
    background:#FBFCFE;
    line-height:1.5;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    position:relative;
  }

  /* Fondo: blanco con halos azules tenues + retícula de puntos */
  body::before{
    content:'';
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(720px 460px at 12% -10%, rgba(96,165,250,.14), rgba(96,165,250,0) 62%),
      radial-gradient(680px 420px at 108% 110%, rgba(37,99,235,.08), rgba(37,99,235,0) 60%),
      radial-gradient(900px 560px at 50% 50%, rgba(255,255,255,1), rgba(255,255,255,0) 70%);
  }
  body::after{
    content:'';
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:radial-gradient(circle, rgba(37,99,235,.10) 1px, transparent 1.3px);
    background-size:24px 24px;
    -webkit-mask-image:radial-gradient(ellipse 62% 55% at 50% 50%, #000 20%, transparent 78%);
            mask-image:radial-gradient(ellipse 62% 55% at 50% 50%, #000 20%, transparent 78%);
    opacity:.7;
  }

  .ico{ width:20px; height:20px; display:block; flex:none; }

  /* ── LISTA ──────────────────────────────────────────── */
  .stack{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    gap:12px;
    list-style:none;
  }

  /* Pequeña separación visual entre bloque 1 y bloque 2 */
  .gap{ height:10px; }

  /* ── ITEM ───────────────────────────────────────────── */
  .item{
    position:relative;
    display:flex;
    align-items:center;
    gap:15px;
    padding:16px 18px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--r);
    text-decoration:none;
    color:inherit;
    box-shadow:
      0 1px 2px rgba(11,23,41,.03),
      0 6px 16px -12px rgba(11,23,41,.10);
    transition:
      transform .38s var(--ease),
      box-shadow .38s var(--ease),
      border-color .38s var(--ease),
      background-color .38s var(--ease);
  }
  .item:hover{
    transform:translateY(-3px);
    border-color:#C9DEFB;
    box-shadow:
      0 2px 4px rgba(11,23,41,.03),
      0 22px 40px -22px rgba(37,99,235,.55);
  }
  .item:active{ transform:translateY(-1px); }
  .item:focus-visible{
    outline:2px solid var(--blue-500);
    outline-offset:2px;
  }

  /* Ícono */
  .box{
    width:46px; height:46px; flex:none;
    border-radius:13px;
    display:grid; place-items:center;
    background:linear-gradient(150deg,#F2F7FF 0%,#E2EDFE 100%);
    border:1px solid #D9E7FB;
    color:var(--blue-600);
    transition:
      background .4s var(--ease),
      color .4s var(--ease),
      border-color .4s var(--ease),
      box-shadow .4s var(--ease),
      transform .4s var(--ease);
  }
  .box .ico{ width:21px; height:21px; }
  .item:hover .box{
    background:var(--grad);
    border-color:transparent;
    color:#fff;
    transform:scale(1.05) rotate(-2deg);
    box-shadow:0 10px 22px -12px rgba(37,99,235,.85);
  }

  /* Texto */
  .label{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
    font-size:.96rem;
    font-weight:600;
    letter-spacing:-.008em;
    color:var(--ink);
    line-height:1.3;
  }

  /* Flecha */
  .arrow{
    width:32px; height:32px; flex:none;
    border-radius:50%;
    display:grid; place-items:center;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted-2);
    transition:
      background .38s var(--ease),
      color .38s var(--ease),
      border-color .38s var(--ease),
      transform .38s var(--ease),
      box-shadow .38s var(--ease);
  }
  .arrow .ico{ width:14px; height:14px; }
  .item:hover .arrow{
    background:var(--blue-600);
    border-color:var(--blue-600);
    color:#fff;
    transform:translateX(3px);
    box-shadow:0 8px 18px -10px rgba(37,99,235,.9);
  }

  /* Chips */
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 9px;
    border-radius:999px;
    font-size:.62rem;
    font-weight:700;
    letter-spacing:.07em;
    text-transform:uppercase;
    white-space:nowrap;
    border:1px solid transparent;
  }
  .chip .ico{ width:11px; height:11px; }

  .chip-ok{
    background:var(--blue-50);
    border-color:#D3E3FB;
    color:var(--blue-700);
  }
  .chip-lock{
    background:#F4F6FA;
    border-color:#E5EBF3;
    color:#8494AB;
  }
  .chip-age{
    background:#FFF7EE;
    border-color:#FFE0BF;
    color:#B45309;
  }

  /* Estado bloqueado (iOS) */
  .item.is-locked{
    cursor:not-allowed;
    background:#FBFCFF;
    border-style:dashed;
    border-color:#E1E9F4;
    box-shadow:none;
  }
  .item.is-locked:hover{
    transform:none;
    border-color:#D5E0EF;
    box-shadow:none;
  }
  .item.is-locked .box{
    background:#F4F7FC;
    border-color:#E7EDF6;
    color:#A6B3C7;
  }
  .item.is-locked:hover .box{
    background:#F4F7FC;
    border-color:#E7EDF6;
    color:#A6B3C7;
    transform:none;
    box-shadow:none;
  }
  .item.is-locked .label{ color:#5D6C83; }
  .item.is-locked .arrow{
    background:transparent;
    border-color:#E7EDF6;
    color:#B4BFD0;
  }
  .item.is-locked:hover .arrow{
    background:transparent;
    border-color:#E7EDF6;
    color:#B4BFD0;
    transform:none;
    box-shadow:none;
  }

  /* ── TOAST ──────────────────────────────────────────── */
  .toast{
    position:fixed;
    left:50%; bottom:26px;
    transform:translate(-50%,20px);
    display:flex; align-items:center; gap:10px;
    max-width:calc(100vw - 40px);
    padding:12px 20px 12px 16px;
    border-radius:999px;
    background:#0A1628;
    color:#F5F8FD;
    font-size:.8rem;
    font-weight:500;
    letter-spacing:.005em;
    box-shadow:0 22px 44px -16px rgba(10,22,40,.6);
    opacity:0;
    pointer-events:none;
    z-index:100;
    transition:opacity .38s var(--ease), transform .38s var(--ease);
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
  .toast .ico{ width:15px; height:15px; color:var(--blue-400); }

  /* ── ENTRADA ────────────────────────────────────────── */
  .reveal{ opacity:0; }
  .reveal.revealed{ opacity:1; }
  .reveal.in{ animation:drop .68s var(--ease) both; }

  @keyframes drop{
    from{ opacity:0; transform:translateY(18px) scale(.985); }
    to  { opacity:1; transform:translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }

  /* ── RESPONSIVE ─────────────────────────────────────── */
  @media (max-width:420px){
    body{ padding:28px 16px; }
    .stack{ gap:10px; max-width:100%; }
    .item{ padding:14px 15px; gap:13px; }
    .box{ width:42px; height:42px; border-radius:12px; }
    .box .ico{ width:19px; height:19px; }
    .label{ font-size:.92rem; }
    .arrow{ width:30px; height:30px; }
  }

  @media (min-width:760px){
    .stack{ max-width:480px; gap:13px; }
    .item{ padding:18px 20px; gap:16px; }
  }
</style>
</head>

<script>
(function () {
  'use strict';

  /* ── Toast ─────────────────────────────────────────── */
  var toastEl = document.getElementById('toast');
  var toastText = document.getElementById('toastText');
  var toastTimer = null;
  function showToast(msg){
    toastText.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 3600);
  }

  /* ── Detección iOS ─────────────────────────────────── */
  function isIOSDevice(){
    var ua = navigator.userAgent || '';
    var platform = navigator.platform || '';
    var touch = navigator.maxTouchPoints || 0;

    // iPhone, iPod, iPad (UA clásico)
    if (/iPhone|iPod|iPad/.test(ua)) return true;

    // iPadOS 13+ se reporta como Mac con soporte táctil
    if (platform === 'MacIntel' && touch > 1) return true;
    if (/Macintosh/.test(ua) && touch > 1) return true;

    // User-Agent Client Hints (Chrome/Edge/Opera modernos)
    if (navigator.userAgentData && /iOS/i.test(navigator.userAgentData.platform || '')) return true;

    return false;
  }

  /* ── Estado del enlace iOS ─────────────────────────── */
  var iosItem  = document.getElementById('iosItem');
  var iosChip  = document.getElementById('iosChip');
  var iosArrow = document.getElementById('iosArrow');

  if (isIOSDevice()){
    iosChip.className = 'chip chip-ok';
    iosChip.innerHTML = '<svg class="ico" aria-hidden="true"><use href="#i-check"/></svg> Disponible';
  } else {
    iosItem.classList.add('is-locked');
    iosItem.setAttribute('aria-disabled', 'true');
    iosArrow.setAttribute('href', '#i-lock');

    iosItem.addEventListener('click', function (e){
      e.preventDefault();
      showToast('Este grupo es exclusivo para dispositivos iOS.');
    });
  }

  /* ── Entrada escalonada ────────────────────────────── */
  var items = document.querySelectorAll('.reveal');

  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function (entries){
      entries.forEach(function (entry){
        if (!entry.isIntersecting) return;
        var el = entry.target;

        el.style.animationDelay = el.getAttribute('data-delay') || '0ms';
        el.classList.add('in');

        el.addEventListener('animationend', function handler(){
          el.classList.remove('in');
          el.classList.add('revealed');
          el.style.animationDelay = '';
          el.removeEventListener('animationend', handler);
        });

        io.unobserve(el);
      });
    }, { threshold:0.08, rootMargin:'0px 0px -30px 0px' });

    items.forEach(function (el){ io.observe(el); });
  } else {
    items.forEach(function (el){ el.classList.add('revealed'); });
  }

})();
</script>
</body>
