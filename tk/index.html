<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#121316"><title>BUSINESS CONTROL</title>
<style>
:root{--bg:#101114;--s1:#191b20;--s2:#22252c;--bd:#30343e;--tx:#eeeae2;--mu:#9b9da6;--ac:#d4af37;--ok:#65bd86;--er:#e07168;--blue:#7da9d8}
*{box-sizing:border-box}
html{scroll-behavior:smooth;touch-action:pan-x pan-y}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
button,input,select,textarea{font:inherit}
button{cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease,transform .1s ease}
.btn:active{transform:scale(.97)}
#layout{display:flex;min-height:100vh}
aside{width:220px;background:var(--s1);border-right:1px solid var(--bd);padding:18px 10px;position:fixed;inset:0 auto 0 0;z-index:5;overflow:auto}
.brand{padding:8px 10px 22px}
.brand b{color:var(--ac);letter-spacing:1.5px;font-size:15px}
.brand small{display:block;color:var(--mu);font-size:10px;letter-spacing:1.4px;margin-top:4px}
nav{display:grid;gap:4px}
nav button{border:0;background:transparent;color:var(--mu);text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:11px;align-items:center;min-width:0}
nav button.active,nav button:hover{background:var(--s2);color:var(--tx)}
.ico{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--ac);flex-shrink:0;transition:transform .2s ease}
.ico svg{width:100%;height:100%}
nav button:hover .ico{transform:scale(1.12)}
nav .nav-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
main{margin-left:220px;width:calc(100% - 220px);max-width:1500px;padding:26px 30px 50px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:23px;margin:0}
.sub{color:var(--mu);font-size:12px}
.pill{border:1px solid var(--bd);border-radius:20px;padding:6px 10px;color:var(--mu);font-size:11px;white-space:nowrap;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px}
.card,.panel{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:15px;margin-bottom:14px;min-width:0;animation:fadeUp .35s ease both;transition:border-color .2s ease}
.card:hover{border-color:#3b4150}
.metric small{display:block;color:var(--mu);font-size:11px;overflow-wrap:break-word}
.metric strong{display:block;font-size:21px;margin-top:5px;overflow-wrap:anywhere;line-height:1.2}
.metric .hint{font-size:11px;color:var(--mu);margin-top:4px;overflow-wrap:break-word}
.section-title{font-size:14px;color:var(--ac);margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.section-title .ico{width:16px;height:16px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:11px}
.field{display:flex;flex-direction:column;gap:5px;color:var(--mu);font-size:11px;min-width:0}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea,input,select,textarea{background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:10px;min-width:0;width:100%;outline:none;transition:border-color .15s ease,background .15s ease}
input[type="date"]{min-width:0;max-width:100%;width:100%;-webkit-appearance:none;appearance:none}
input[type="date"]::-webkit-datetime-edit,
input[type="date"]::-webkit-datetime-edit-fields-wrapper,
input[type="date"]::-webkit-datetime-edit-text,
input[type="date"]::-webkit-datetime-edit-month-field,
input[type="date"]::-webkit-datetime-edit-day-field,
input[type="date"]::-webkit-datetime-edit-year-field{padding:0;margin:0;min-width:0}
input[type="date"]::-webkit-calendar-picker-indicator{padding:0;margin:0 0 0 4px;cursor:pointer;opacity:.6;flex-shrink:0}
input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:1}
input[type="date"]::-webkit-inner-spin-button{display:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.btn{border:1px solid var(--bd);background:var(--s2);color:var(--tx);padding:9px 13px;border-radius:8px;white-space:nowrap}
.btn:hover{background:#2a2d36}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#171717;font-weight:700}
.btn.primary:hover{background:#e0bd44}
.btn.danger{color:var(--er)}
.btn.small{padding:5px 8px;font-size:11px}
.tablewrap{overflow:auto;border:1px solid var(--bd);border-radius:9px;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:10px 9px;text-align:left;border-bottom:1px solid var(--bd);font-size:12px;white-space:nowrap}
th{color:var(--mu);font-weight:500;background:#202229;position:sticky;top:0}
tr:last-child td{border-bottom:0}
.muted{color:var(--mu)}
.positive{color:var(--ok)}
.negative{color:var(--er)}
.gold{color:var(--ac)}
.tag{display:inline-block;padding:3px 7px;border-radius:20px;background:var(--s2);color:var(--mu);font-size:10px}
.notice{padding:11px 13px;border:1px solid #695b2d;background:#302a19;color:#e4ce85;border-radius:9px;margin-bottom:13px;font-size:12px;overflow-wrap:break-word}
.empty{padding:25px;text-align:center;color:var(--mu)}
.hidden{display:none!important}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.search{max-width:300px;width:100%}
.actions{display:flex;gap:6px}
.foot{color:var(--mu);font-size:11px;margin-top:18px}
.filelabel{display:inline-flex;align-items:center;gap:8px}
.filelabel input{display:none}
.bar{height:8px;border-radius:10px;background:var(--s2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ac)}

/* Biz tabs */
.biz-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.biz-tab{background:var(--s2);border:1px solid var(--bd);color:var(--mu);padding:12px;border-radius:10px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s ease;min-width:0}
.biz-tab.active{background:var(--ac);color:#171717;border-color:var(--ac)}
.biz-tab:hover:not(.active){background:#2a2d36;color:var(--tx)}

/* Product cards */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.product-card{background:var(--s2);border:2px solid var(--bd);color:var(--tx);padding:14px 12px;border-radius:10px;text-align:left;transition:all .2s ease;display:flex;flex-direction:column;gap:6px;min-width:0}
.product-card:hover{border-color:#4a5060;transform:translateY(-2px)}
.product-card.active{border-color:var(--ac);background:#2a2518}
.product-card.custom{border-style:dashed;color:var(--mu)}
.pc-name{font-weight:600;font-size:13px;line-height:1.2;overflow-wrap:break-word}
.pc-price{font-size:12px;color:var(--ac);font-weight:600}
.product-card.custom .pc-price{color:var(--mu)}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ok);color:#0d1a12;padding:12px 20px;border-radius:24px;font-weight:600;font-size:13px;z-index:200;animation:toastIn .3s ease both;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.toast.out{animation:toastOut .3s ease both}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fadeIn .15s ease}
.modal-box{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;animation:fadeUp .2s ease}

/* Charts */
.chart-block{margin-top:6px}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding:20px 0 0;border-bottom:1px solid var(--bd)}
.cb-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.cb-bar{width:100%;max-width:38px;height:var(--pct);background:var(--ac);border-radius:4px 4px 0 0;position:relative;transform-origin:bottom;animation:barGrow .6s var(--delay) cubic-bezier(.2,.8,.3,1) both;min-height:2px;transition:filter .2s ease}
.cb-bar:hover{filter:brightness(1.2)}
.cb-val{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--mu);font-weight:500;white-space:nowrap}
.cb-label{font-size:10px;color:var(--mu);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.donut{width:130px;height:130px;flex-shrink:0}
.donut path{animation:fadeIn .5s ease both}
.legend{display:grid;gap:5px;min-width:0;flex:1}
.leg-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mu);min-width:0}
.leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.leg-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.leg-val{color:var(--tx);font-size:11px;margin-left:auto;flex-shrink:0;padding-left:6px}
.chart-empty{padding:16px;text-align:center;color:var(--mu);font-size:12px}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(-50%) translateY(20px)}}

@media(max-width:760px){
  #layout{display:block}
  aside{inset:auto 0 0;width:100%;height:auto;padding:5px 4px calc(5px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--bd);overflow:visible}
  .brand{display:none}
  nav{display:flex;justify-content:space-around;gap:1px}
  nav button{flex:1;display:flex;flex-direction:column;gap:2px;text-align:center;padding:8px 2px;font-size:10px;border-radius:7px;justify-content:center;min-width:0}
  .ico{width:18px;height:18px}
  nav .nav-lbl{font-size:9px;line-height:1.1;width:100%;text-align:center}
  main{margin:0;width:100%;padding:18px 14px calc(95px + env(safe-area-inset-bottom))}
  .top h1{font-size:20px}
  .pill{font-size:10px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric strong{font-size:18px}
  .split{grid-template-columns:1fr}
  .formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field.full{grid-column:1/-1}
  .search{max-width:100%}
  .chart-bars{height:130px;gap:5px}
  .cb-bar{max-width:26px}
  .donut{width:110px;height:110px}
  .biz-tabs{grid-template-columns:1fr}
  .product-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
@media(max-width:420px){
  .formgrid{grid-template-columns:1fr}
  .ico{width:16px;height:16px}
  nav .nav-lbl{font-size:8px}
  nav button{padding:7px 1px}
}
@media(max-width:380px){
  .ico{width:14px;height:14px}
  nav .nav-lbl{font-size:7px}
  nav button{padding:6px 1px}
}
</style></head><body><div id="layout"><aside><div class="brand"><b>BUSINESS CONTROL</b><small>LOCAL FINANCIAL SYSTEM</small></div><nav id="nav"></nav></aside><main><div class="top"><div><h1 id="title">Resumen</h1><div class="sub">Control financiero privado · Datos guardados en este dispositivo</div></div><span class="pill" id="saveState">● Local</span></div><div id="app"></div><div class="foot">BUSINESS CONTROL · Los datos permanecen en este navegador. Exporta respaldos periódicamente.</div></main></div>
<div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modalBox"></div></div>
<script>
'use strict';
const DB='business_control_local',STORE='workspace',VERSION=1,LEGACY='panel_negocios_v1';
const NAV=[['dash','dash','Resumen'],['sales','sales','Ventas'],['catalog','catalog','Catálogo'],['clients','clients','Clientes'],['accounts','accounts','Cuentas'],['expenses','expenses','Gastos'],['moves','moves','Movimientos'],['reports','reports','Informes'],['backup','backup','Respaldo']];
const METHODS=['BOLD','PayPal','Binance','Skrill','AstroPay','Remitly','Nequi','Bancolombia','CLABE (MX)','Efectivo','Otro'];
const BIZ=[['D','Diamantes Free Fire'],['P','Programación'],['S','Compartido'],['X','Personal']];const CURRENCIES=['COP','USD','MXN','USDT'];

/* ===== Iconos SVG ===== */
const ICONS={
  dash:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  sales:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
  clients:'<circle cx="9" cy="7" r="4"/><path d="M17 11a3 3 0 100-6"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M21 21v-2a4 4 0 00-3-3.87"/>',
  accounts:'<rect x="2" y="6" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2" fill="currentColor" stroke="none"/>',
  expenses:'<path d="M3 12l9 9 9-9M12 3v18"/>',
  moves:'<path d="M7 4L3 8l4 4"/><path d="M3 8h18"/><path d="M17 20l4-4-4-4"/><path d="M21 16H3"/>',
  reports:'<path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-5"/>',
  backup:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  pie:'<path d="M12 3a9 9 0 109 9h-9z"/><path d="M12 3v9h9"/>',
  catalog:'<path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>'
};
function ic(name,size=20){return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`}

/* ===== Helpers de gráficas ===== */
const CHART_COLORS=['#d4af37','#7da9d8','#65bd86','#e07168','#b07dd8','#d8a67d','#7dd8c9','#d87db0'];
function fmtShort(n){n=Number(n)||0;const a=Math.abs(n);if(a>=1e6)return (n/1e6).toFixed(1)+'M';if(a>=1e3)return (n/1e3).toFixed(0)+'k';return a?a.toFixed(0):''}
function monthShort(k){const names=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];const m=k.slice(5,7);return names[parseInt(m,10)-1]+k.slice(2,4)}
function chartBars(items){
  if(!items||!items.length)return `<div class="chart-empty">Sin datos suficientes</div>`;
  const max=Math.max(...items.map(d=>Math.abs(Number(d.value)||0)),1);
  return `<div class="chart-bars">${items.map((d,i)=>{
    const pct=Math.max(2,(Math.abs(Number(d.value)||0)/max)*100);
    const color=d.color||CHART_COLORS[i%CHART_COLORS.length];
    return `<div class="cb-col"><div class="cb-bar" style="--pct:${pct}%;--delay:${(i*0.05).toFixed(2)}s;background:${color}"><span class="cb-val">${esc(d.display||'')}</span></div><div class="cb-label" title="${esc(d.label)}">${esc(d.label)}</div></div>`;
  }).join('')}</div>`;
}
function chartDonut(segments){
  const valid=(segments||[]).filter(s=>Number(s.value)>0);
  if(!valid.length)return `<div class="chart-empty">Sin datos suficientes</div>`;
  const total=valid.reduce((s,x)=>s+Number(x.value),0);
  const R=44,r=28,cx=50,cy=50;let angle=-Math.PI/2;
  const paths=valid.map((s,i)=>{
    const a=(Number(s.value)/total)*Math.PI*2;
    const x1=cx+R*Math.cos(angle),y1=cy+R*Math.sin(angle);
    const x2=cx+R*Math.cos(angle+a),y2=cy+R*Math.sin(angle+a);
    const xi1=cx+r*Math.cos(angle+a),yi1=cy+r*Math.sin(angle+a);
    const xi2=cx+r*Math.cos(angle),yi2=cy+r*Math.sin(angle);
    const large=a>Math.PI?1:0;
    const d=`M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${xi1.toFixed(2)},${yi1.toFixed(2)} A${r},${r} 0 ${large} 0 ${xi2.toFixed(2)},${yi2.toFixed(2)} Z`;
    angle+=a;
    return `<path d="${d}" fill="${s.color||CHART_COLORS[i%CHART_COLORS.length]}"/>`;
  }).join('');
  const legend=valid.map((s,i)=>`<div class="leg-item"><span class="leg-dot" style="background:${s.color||CHART_COLORS[i%CHART_COLORS.length]}"></span><span class="leg-lbl" title="${esc(s.label)}">${esc(s.label)}</span><span class="leg-val">${esc(s.display||fmtShort(s.value))}</span></div>`).join('');
  return `<div class="chart-donut"><svg viewBox="0 0 100 100" class="donut">${paths}</svg><div class="legend">${legend}</div></div>`;
}

/* ===== Catálogo por defecto ===== */
function defaultCatalog(){return {
  D:{label:'Diamantes Free Fire',icon:'dash',products:[
    {id:'d_100', name:'100 diamantes', price:12000, cost:null, currency:'COP', delivery:'Entregado'},
    {id:'d_220', name:'220 diamantes', price:22000, cost:null, currency:'COP', delivery:'Entregado'},
    {id:'d_500', name:'500 diamantes', price:48000, cost:null, currency:'COP', delivery:'Entregado'},
    {id:'d_1080',name:'1080 diamantes',price:95000, cost:null, currency:'COP', delivery:'Entregado'},
    {id:'d_2200',name:'2200 diamantes',price:190000,cost:null, currency:'COP', delivery:'Entregado'},
    {id:'d_5600',name:'5600 diamantes',price:470000,cost:null, currency:'COP', delivery:'Entregado'}
  ]},
  P:{label:'Programación',icon:'reports',products:[
    {id:'p_landing',name:'Landing page',price:600000,cost:null,currency:'COP',delivery:'Pendiente'},
    {id:'p_web',    name:'Página web completa',price:1500000,cost:null,currency:'COP',delivery:'Pendiente'},
    {id:'p_bot',    name:'Bot de WhatsApp',price:800000,cost:null,currency:'COP',delivery:'Pendiente'},
    {id:'p_script', name:'Script a medida',price:500000,cost:null,currency:'COP',delivery:'Pendiente'},
    {id:'p_mant',   name:'Mantenimiento mensual',price:250000,cost:null,currency:'COP',delivery:'Pendiente'},
    {id:'p_hora',   name:'Hora de consultoría',price:80000,cost:null,currency:'COP',delivery:'Entregado'}
  ]}
}}

/* ===== Estado ===== */
const defaultState=()=>({schema:'business-control-local',version:1,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),settings:{rates:{COP:1,USD:0,MXN:0,USDT:0},businessNames:{D:'Diamantes Free Fire',P:'Programación'}},catalog:defaultCatalog(),accounts:[],customers:[],sales:[],expenses:[],transfers:[],adjustments:[],audit:[]});
let S=defaultState(),current='dash',filter='month',searchTerm='';
let saleForm={biz:'D',productId:null};
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);const num=v=>Number.isFinite(+v)?+v:0;const round=n=>Math.round((n+Number.EPSILON)*100)/100;
const dateNow=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(num(n));const fmtN=n=>new Intl.NumberFormat('es-CO',{maximumFractionDigits:2}).format(num(n));
const rate=c=>c==='COP'?1:num(S.settings.rates[c]);const businessName=b=>S.settings.businessNames[b]||({'S':'Compartido','X':'Personal'}[b]||b);

function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function persist(){S.updatedAt=new Date().toISOString();try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(S,'main');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();$('#saveState').textContent='● Guardado local';$('#saveState').style.color='var(--ok)'}catch(e){$('#saveState').textContent='Error al guardar';$('#saveState').style.color='var(--er)';alert('No se pudo guardar en el almacenamiento local.');throw e}}

function ensureCatalog(state){
  if(!state.catalog||typeof state.catalog!=='object')state.catalog={};
  const def=defaultCatalog();
  if(!state.catalog.D||!Array.isArray(state.catalog.D.products))state.catalog.D=def.D;
  if(!state.catalog.P||!Array.isArray(state.catalog.P.products))state.catalog.P=def.P;
  return state;
}

async function init(){try{const db=await openDB();const saved=await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();if(saved&&saved.schema==='business-control-local')S=ensureCatalog(saved);else{const old=localStorage.getItem(LEGACY);if(old){try{S=ensureCatalog(migrateLegacy(JSON.parse(old)));await persist();alert('Se importaron automáticamente los datos del panel anterior.')}catch(e){}}}}catch(e){alert('Este navegador no permitió abrir IndexedDB.');}render()}

function migrateLegacy(d){const n=defaultState();n.settings.rates={...n.settings.rates,...(d.rates||{})};n.accounts=(d.accounts||[]).map(a=>({...a,id:a.id||id('A')}));n.customers=(d.customers||[]).map(c=>({...c,id:c.id||id('C'),players:c.players||[]}));n.sales=(d.sales||[]).map(s=>({...s,id:s.id||id('V'),withholding:num(s.withholding),otherFees:num(s.otherFees),actualNet:null,actualCurrency:s.cur||'COP',actualRate:num(s.rate),status:s.pay||'pagado',deleted:!!s.anulada}));n.expenses=(d.expenses||[]).map(e=>({...e,id:e.id||id('G'),deleted:false}));n.transfers=(d.transfers||[]).map(t=>({...t,id:t.id||id('T')}));return n}
function audit(action,detail){S.audit.unshift({id:id('LOG'),at:new Date().toISOString(),action,detail});if(S.audit.length>3000)S.audit.length=3000}
function setPage(p){current=p;searchTerm='';render()}
function render(){const item=NAV.find(x=>x[0]===current)||NAV[0];$('#title').textContent=item[2];$('#nav').innerHTML=NAV.map(x=>`<button class="${current===x[0]?'active':''}" onclick="setPage('${x[0]}')"><span class="ico">${ic(x[1])}</span><span class="nav-lbl">${x[2]}</span></button>`).join('');const views={dash:dashboard,sales:salesPage,catalog:catalogPage,clients:clientsPage,accounts:accountsPage,expenses:expensesPage,moves:movesPage,reports:reportsPage,backup:backupPage};$('#app').innerHTML=views[current]();if(current==='sales')drawSales();}
function periodMatch(d){if(filter==='all')return true;if(!d)return false;const t=dateNow();if(filter==='month')return d.slice(0,7)===t.slice(0,7);if(filter==='year')return d.slice(0,4)===t.slice(0,4);if(filter==='30'){const x=new Date();x.setDate(x.getDate()-30);return d>=x.toISOString().slice(0,10)}return true}
function liveSales(){return S.sales.filter(x=>!x.deleted)}function salesFor(b){return liveSales().filter(x=>(!b||x.biz===b)&&periodMatch(x.date))}
function saleGrossCOP(s){return num(s.gross)*num(s.rate)}function saleFeeCOP(s){return (num(s.fee)+num(s.withholding)+num(s.otherFees))*num(s.rate)}function saleCostCOP(s){return s.cost===null||s.cost===undefined?null:num(s.cost)*num(s.costRate||s.rate)}
function accountBalance(a){let bal=num(a.opening);for(const m of accountMovements(a.id))bal+=m.delta;return round(bal)}
function accountMovements(aid){const out=[];for(const s of liveSales()){if(s.accountId===aid&&s.status==='pagado'){const isActual=s.actualNet!==null&&s.actualNet!==undefined;const received=isActual?num(s.actualNet):num(s.gross)-num(s.fee)-num(s.withholding)-num(s.otherFees);const cur=isActual?(s.actualCurrency||s.cur):s.currency;if(cur===S.accounts.find(a=>a.id===aid)?.currency)out.push({date:s.receivedDate||s.date,delta:received,kind:'Venta',id:s.id})}}
for(const e of S.expenses.filter(e=>!e.deleted&&e.paymentStatus==='pagado'&&e.accountId===aid)){if(e.currency===S.accounts.find(a=>a.id===aid)?.currency)out.push({date:e.date,delta:-num(e.amount),kind:'Gasto',id:e.id})}
for(const t of S.transfers){if(t.from===aid)out.push({date:t.date,delta:-(num(t.amountOut)+num(t.fee)),kind:'Transferencia enviada',id:t.id});if(t.to===aid)out.push({date:t.date,delta:num(t.amountIn),kind:'Transferencia recibida',id:t.id})}
for(const a of S.adjustments.filter(x=>x.accountId===aid))out.push({date:a.date,delta:num(a.amount),kind:'Ajuste',id:a.id});return out}
function sum(a,k){return a.reduce((v,x)=>v+num(k(x)),0)}
function financialStats(b){const ss=salesFor(b),paid=ss.filter(s=>s.status==='pagado'),gross=sum(paid,saleGrossCOP),fees=sum(paid,saleFeeCOP),cost=sum(paid,s=>saleCostCOP(s)??0),ex=sum(S.expenses.filter(e=>!e.deleted&&e.biz===b&&periodMatch(e.date)),e=>num(e.amount)*num(e.rate));const unknown=paid.filter(s=>saleCostCOP(s)===null).length;const receivable=sum(ss.filter(s=>s.status==='pendiente'),saleGrossCOP);return{count:ss.length,gross,fees,cost,expenses:ex,profit:gross-fees-cost-ex,receivable,unknown}}
function metric(label,value,hint=''){return `<div class="card metric"><small>${label}</small><strong>${value}</strong>${hint?`<div class="hint">${hint}</div>`:''}</div>`}
function filterBar(){return `<div class="row" style="margin-bottom:14px"><select style="width:auto" onchange="filter=this.value;render()">${[['month','Mes actual'],['30','Últimos 30 días'],['year','Año actual'],['all','Todo el historial']].map(x=>`<option value="${x[0]}" ${filter===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>`}

function monthlySalesData(months=6){const map={};const now=new Date();for(let i=months-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const k=d.toISOString().slice(0,7);map[k]=0}for(const s of liveSales().filter(s=>s.status==='pagado')){const k=s.date.slice(0,7);if(k in map)map[k]+=saleGrossCOP(s)}return Object.entries(map).map(([k,v])=>({label:monthShort(k),value:v,display:fmtShort(v)}))}
function expensesByCategory(){const map={};for(const e of S.expenses.filter(e=>!e.deleted)){const k=e.category||'Sin categoría';map[k]=(map[k]||0)+num(e.amount)*num(e.rate)}return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([label,value],i)=>({label,value,color:CHART_COLORS[i%CHART_COLORS.length],display:fmtShort(value)}))}

function accountBalancesData(){return S.accounts.map((a,i)=>{const bal=accountBalance(a)*rate(a.currency);return {label:a.name,value:bal,color:CHART_COLORS[i%CHART_COLORS.length],display:fmtShort(bal)}}).filter(x=>x.value>0)}
function salesByMethod(){const map={};for(const s of liveSales().filter(s=>s.status==='pagado'&&periodMatch(s.date))){map[s.method]=(map[s.method]||0)+saleGrossCOP(s)}return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([label,value],i)=>({label,value,color:CHART_COLORS[i%CHART_COLORS.length],display:fmtShort(value)}))}
function topClientsData(){const map={};for(const s of liveSales().filter(s=>s.status==='pagado')){map[s.customerName]=(map[s.customerName]||0)+saleGrossCOP(s)}return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([label,value],i)=>({label,value,color:CHART_COLORS[i%CHART_COLORS.length],display:fmtShort(value)}))}
function monthlyExpensesData(months=6){const map={};const now=new Date();for(let i=months-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const k=d.toISOString().slice(0,7);map[k]=0}for(const e of S.expenses.filter(e=>!e.deleted)){const k=(e.date||'').slice(0,7);if(k in map)map[k]+=num(e.amount)*num(e.rate)}return Object.entries(map).map(([k,v])=>({label:monthShort(k),value:v,display:fmtShort(v),color:CHART_COLORS[3]}))}

ategory())}</section></div><section class="panel"><h3 class="section-title">${ic('pie',16)} Gastos por asignación</h3>${chartDonut(expensesByBusiness())}</section><section class="panel"><div class="row between"><h3 class="section-title">${ic('accounts',16)} Saldos por cuenta</h3><button class="btn small" onclick="setPage('accounts')">Administrar cuentas</button></div>${S.accounts.length?`<div class="tablewrap"><table><tr><th>Cuenta</th><th>Moneda</th><th>Saldo calculado</th><th>Equivalente COP</th></tr>${S.accounts.map(a=>`<tr><td>${esc(a.name)}</td><td>${a.currency}</td><td>${fmtN(accountBalance(a))} ${a.currency}</td><td>${rate(a.currency)?fmt(accountBalance(a)*rate(a.currency)):'Tasa pendiente'}</td></tr>`).join('')}</table></div>`:'<div class="empty">Todavía no hay cuentas.</div>'}</section>`}

    <label class="field">Cuenta receptora<select name="accountId"><option value="">Sin asignar</option>${S.accounts.map(a=>`<option value="${a.id}" ${a.id===def.accountId?'selected':''}>${esc(a.name)} · ${a.currency}</option>`).join('')}</select></label>
    <label class="field">Estado pago<select name="status"><option value="pagado" selected>Pagado</option><option value="pendiente">Pendiente</option></select></label>
    <label class="field">Entrega<select name="delivery">${['Entregado','Pendiente','Fallido'].map(d=>`<option ${d===p.delivery?'selected':''}>${d}</option>`).join('')}</select></label>
  </div>
  <input type="hidden" name="_saveNew" value="0">
  <div class="row" style="margin-top:14px"><button type="submit" class="btn primary" onclick="this.form._saveNew.value='0'">Guardar venta</button><button type="submit" class="btn" onclick="this.form._saveNew.value='1'">Guardar y nueva</button><button type="button" class="btn" onclick="document.getElementById('advanced-fields').classList.toggle('hidden')">Más opciones ▾</button></div>
  <div id="advanced-fields" class="hidden" style="margin-top:14px"><div class="formgrid">
    <label class="field">Tasa a COP<input name="rate" type="number" min="0" step="0.0001" value="${r}"></label>

function drawSales(){
  const host=$('#salesTable');if(!host)return;
  const q=searchTerm.toLowerCase(), biz=saleForm.biz;
  const list=liveSales().filter(s=>s.biz===biz).slice().reverse().filter(s=>([s.customerName,s.item,s.playerId,s.id,s.method].join(' ').toLowerCase()).includes(q));
  host.innerHTML=list.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Cliente / ID</th><th>Producto</th><th>Venta</th><th>Neto</th><th>Recibido</th><th>Pago</th><th>Entrega</th><th></th></tr>${list.map(s=>`<tr><td>${s.date}</td><td>${esc(s.customerName)}${s.playerId?`<br><span class="muted">ID ${esc(s.playerId)}</span>`:''}</td><td>${esc(s.item)}</td><td>${fmtN(s.gross)} ${s.currency}</td><td>${fmtN(s.gross-s.fee-s.withholding-s.otherFees)} ${s.currency}</td><td>${s.actualNet===null?'—':fmtN(s.actualNet)+' '+s.actualCurrency}</td><td><span class="tag">${s.status}</span></td><td>${esc(s.delivery)}</td><td><button class="btn small danger" onclick="voidRecord('sales','${s.id}')">Anular</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Aún no hay ventas de este negocio.</div>';
}

function syncSaleCurrency(form){const cur=form.currency.value;if(form.actualCurrency)form.actualCurrency.value=cur;if(form.costCurrency)form.costCurrency.value=cur;const r=rate(cur);if(r){if(form.rate&&!form.rate.value)form.rate.value=r;if(form.costRate&&!form.costRate.value)form.costRate.value=r;if(form.actualRate&&!form.actualRate.value)form.actualRate.value=r}}

function saveSale(e){
  e.preventDefault();
  const form=e.target;
  const f=Object.fromEntries(new FormData(form));
  const saveNew=f._saveNew==='1';
  const r=f.currency==='COP'?1:num(f.rate||rate(f.currency));
  if(!r){alert('Debes indicar la tasa a COP de la venta.');return}
  if(num(f.fee)+num(f.withholding)+num(f.otherFees)>num(f.gross)){if(!confirm('Los descuentos superan el importe bruto. ¿Registrar de todas formas?'))return}
  let c=S.customers.find(x=>(f.phone&&x.phone===f.phone)||(f.telegram&&x.telegram===f.telegram)||x.name.toLowerCase()===f.customer.trim().toLowerCase());
  if(!c){c={id:id('CLI'),name:f.customer.trim(),phone:f.phone||'',telegram:f.telegram||'',playerIds:[],createdAt:new Date().toISOString()};S.customers.push(c)}else{if(f.phone)c.phone=f.phone;if(f.telegram)c.telegram=f.telegram}
  if(f.playerId&&!c.playerIds.includes(f.playerId))c.playerIds.push(f.playerId);
  const cr=f.costCurrency==='COP'?1:num(f.costRate||rate(f.costCurrency));
  const sale={id:id('VEN'),date:f.date,biz:saleForm.biz,productId:saleForm.productId!=='__custom__'?saleForm.productId:null,customerId:c.id,customerName:c.name,phone:f.phone||'',telegram:f.telegram||'',playerId:f.playerId||'',item:f.item,gross:num(f.gross),currency:f.currency,rate:r,fee:num(f.fee),withholding:num(f.withholding),otherFees:num(f.otherFees),cost:f.cost===''?null:num(f.cost),costCurrency:f.costCurrency,costRate:cr,method:f.method,accountId:f.accountId,status:f.status,delivery:f.delivery,actualNet:f.actualNet===''?null:num(f.actualNet),actualCurrency:f.actualCurrency,actualRate:f.actualCurrency==='COP'?1:num(f.actualRate||rate(f.actualCurrency)),receivedDate:f.receivedDate,expiry:f.expiry,notes:f.notes,createdAt:new Date().toISOString(),deleted:false};
  if(sale.status==='pagado'&&sale.accountId){const a=S.accounts.find(x=>x.id===sale.accountId);if(a&&a.currency!==sale.actualCurrency&&!confirm('La moneda de la cuenta no coincide con la moneda recibida. El saldo no se actualizará. ¿Continuar?'))return}
  S.sales.push(sale);
  audit('Venta registrada',sale.id+' · '+sale.customerName);
  persist().then(()=>{
    if(saveNew){
      if(form.customer)form.customer.value='';
      if(form.phone)form.phone.value='';
      if(form.telegram)form.telegram.value='';
      if(form.playerId)form.playerId.value='';
      if(form.notes)form.notes.value='';
      if(form.customer)form.customer.focus();
      drawSales();
      showToast('✓ Venta guardada. Listo para la siguiente.');
    }else{
      saleForm.productId=null;
      render();
    }
  });
}

function catalogPage(){

function renderCatalogSection(bizKey){
  const biz=S.catalog[bizKey], products=biz.products||[];
  return `<section class="panel"><div class="row between" style="margin-bottom:10px"><h3 class="section-title">${esc(biz.label)}</h3><button class="btn small" onclick="addProduct('${bizKey}')">+ Agregar producto</button></div>${products.length?`<div class="tablewrap"><table><tr><th>Nombre</th><th>Precio</th><th>Costo</th><th>Moneda</th><th>Entrega</th><th></th></tr>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${fmtN(p.price)}</td><td>${p.cost!=null?fmtN(p.cost):'—'}</td><td>${esc(p.currency||'COP')}</td><td>${esc(p.delivery||'Entregado')}</td><td><button class="btn small" onclick="editProduct('${bizKey}','${p.id}')">Editar</button> <button class="btn small danger" onclick="deleteProduct('${bizKey}','${p.id}')">Borrar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Sin productos. Agrega el primero.</div>'}</section>`;
}
function addProduct(bizKey){
  openModal(`<h3 class="section-title">Nuevo producto · ${esc(S.catalog[bizKey].label)}</h3><form onsubmit="saveNewProduct(event,'${bizKey}')" class="formgrid" style="grid-template-columns:1fr 1fr"><label class="field full">Nombre<input name="name" required placeholder="Ej. 500 diamantes / Landing page"></label><label class="field">Precio<input name="price" type="number" min="0" step="0.01" required></label><label class="field">Costo (opcional)<input name="cost" type="number" min="0" step="0.01"></label><label class="field">Moneda<select name="currency">${CURRENCIES.map(c=>`<option>${c}</option>`).join('')}</select></label><label class="field">Entrega<select name="delivery"><option>Entregado</option><option>Pendiente</option><option>Fallido</option></select></label><div class="row full" style="margin-top:8px"><button class="btn primary" type="submit">Crear</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></form>`);
}
function saveNewProduct(e,bizKey){
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  S.catalog[bizKey].products.push({id:'P-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),name:f.name.trim(),price:num(f.price),cost:f.cost===''?null:num(f.cost),currency:f.currency,delivery:f.delivery});
  audit('Producto creado',bizKey+' · '+f.name);
  persist().then(()=>{closeModal();render()});
}
function editProduct(bizKey,pid){
  const p=S.catalog[bizKey].products.find(x=>x.id===pid);if(!p)return;
  openModal(`<h3 class="section-title">Editar producto</h3><form onsubmit="saveProductEdit(event,'${bizKey}','${pid}')" class="formgrid" style="grid-template-columns:1fr 1fr"><label class="field full">Nombre<input name="name" value="${esc(p.name)}" required></label><label class="field">Precio<input name="price" type="number" min="0" step="0.01" value="${p.price}" required></label><label class="field">Costo (opcional)<input name="cost" type="number" min="0" step="0.01" value="${p.cost??''}"></label><label class="field">Moneda<select name="currency">${CURRENCIES.map(c=>`<option ${c===(p.currency||'COP')?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Entrega<select name="delivery">${['Entregado','Pendiente','Fallido'].map(d=>`<option ${d===(p.delivery||'Entregado')?'selected':''}>${d}</option>`).join('')}</select></label><div class="row full" style="margin-top:8px"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></form>`);
}
function saveProductEdit(e,bizKey,pid){
  e.preventDefault();const p=S.catalog[bizKey].products.find(x=>x.id===pid);if(!p)return;
  const f=Object.fromEntries(new FormData(e.target));
  p.name=f.name.trim();p.price=num(f.price);p.cost=f.cost===''?null:num(f.cost);p.currency=f.currency;p.delivery=f.delivery;
  audit('Producto editado',bizKey+' · '+p.name);
  persist().then(()=>{closeModal();render()});
}
function deleteProduct(bizKey,pid){
  const p=S.catalog[bizKey].products.find(x=>x.id===pid);if(!p)return;
  if(!confirm(`¿Borrar "${p.name}" del catálogo? Las ventas ya registradas no se borran.`))return;
  S.catalog[bizKey].products=S.catalog[bizKey].products.filter(x=>x.id!==pid);
  audit('Producto borrado',bizKey+' · '+p.name);
  persist().then(render);
}
function restoreDefaultCatalog(){
  if(!confirm('Esto reemplazará el catálogo por el de fábrica. Las ventas ya registradas no se tocan. ¿Continuar?'))return;
  S.catalog=defaultCatalog();
  audit('Catálogo restaurado','Valores por defecto');
  persist().then(render);
}

/* ===== Otras páginas ===== */
function clientsPage(){const list=S.customers.filter(c=>(c.name+' '+c.phone+' '+c.telegram+' '+(c.playerIds||[]).join(' ')).toLowerCase().includes(searchTerm.toLowerCase()));return `<section class="panel"><h3 class="section-title">${ic('clients',16)} Top clientes (COP histórico)</h3>${chartBars(topClientsData())}</section><section class="panel"><div class="row between"><h3 class="section-title">Directorio de clientes</h3><input class="search" placeholder="Buscar cliente, teléfono, Telegram o ID" oninput="searchTerm=this.value;render()" value="${esc(searchTerm)}"></div>${list.length?`<div class="tablewrap"><table><tr><th>Cliente</th><th>Teléfono</th><th>Telegram</th><th>IDs de jugador</th><th>Operaciones</th><th>Ventas pagadas COP</th></tr>${list.map(c=>{const ss=liveSales().filter(s=>s.customerId===c.id);return `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.telegram)}</td><td>${esc((c.playerIds||[]).join(', '))}</td><td>${ss.length}</td><td>${fmt(sum(ss.filter(s=>s.status==='pagado'),saleGrossCOP))}</td></tr>`}).join('')}</table></div>`:'<div class="empty">Los clientes se crean al registrar una venta.</div>'}</section>`}
function accountsPage(){return `<section class="panel"><h3 class="section-title">${ic('accounts',16)} Distribución de saldos (COP)</h3>${chartDonut(accountBalancesData())}</section><section class="panel"><h3 class="section-title">Crear cuenta o billetera</h3><form class="formgrid" onsubmit="addAccount(event)"><label class="field">Nombre de la cuenta<input name="name" required placeholder="PayPal USD / Bancolombia"></label><label class="field">Entidad<select name="entity">${METHODS.map(m=>`<option>${m}</option>`)}</select></label><label class="field">Moneda<select name="currency">${CURRENCIES.map(c=>`<option ${c==='COP'?'selected':''}>${c}</option>`)}</select></label><label class="field">Saldo inicial<input name="opening" type="number" step="0.01" value="0"></label><label class="field">Fecha de saldo inicial<input name="openingDate" type="date" value="${dateNow()}"></label><div class="row"><button class="btn primary">Crear cuenta</button></div></form></section><section class="panel"><h3 class="section-title">Saldos calculados</h3>${S.accounts.length?`<div class="tablewrap"><table><tr><th>Cuenta</th><th>Entidad</th><th>Moneda</th><th>Saldo</th><th>Equivalente COP</th><th></th></tr>${S.accounts.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.entity)}</td><td>${a.currency}</td><td>${fmtN(accountBalance(a))}</td><td>${rate(a.currency)?fmt(accountBalance(a)*rate(a.currency)):'Tasa pendiente'}</td><td><button class="btn small" onclick="adjustAccount('${a.id}')">Ajustar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Agrega tus cuentas bancarias y plataformas.</div>'}<p class="muted">El saldo se calcula desde saldo inicial + entradas − salidas + ajustes.</p></section>`}
function addAccount(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));S.accounts.push({id:id('CTA'),name:f.name,entity:f.entity,currency:f.currency,opening:num(f.opening),openingDate:f.openingDate,createdAt:new Date().toISOString()});audit('Cuenta creada',f.name);persist().then(render)}
function adjustAccount(aid){const a=S.accounts.find(x=>x.id===aid);const raw=prompt('Introduce el saldo real contado de '+a.name+' ('+a.currency+').',String(accountBalance(a)));if(raw===null)return;const actual=Number(raw);if(!Number.isFinite(actual))return alert('Valor inválido');const delta=round(actual-accountBalance(a));S.adjustments.push({id:id('AJU'),accountId:aid,date:dateNow(),amount:delta,note:'Ajuste de conciliación manual'});audit('Ajuste de saldo',a.name+' · '+delta);persist().then(render)}
function expensesPage(){return `<div class="split"><section class="panel"><h3 class="section-title">${ic('pie',16)} Gastos por categoría</h3>${chartDonut(expensesByCategory())}</section><section class="panel"><h3 class="section-title">${ic('chart',16)} Gastos por mes (6 meses)</h3>${chartBars(monthlyExpensesData(6))}</section></div><section class="panel"><h3 class="section-title">Registrar gasto / salida</h3><form class="formgrid" onsubmit="addExpense(event)"><label class="field">Fecha<input type="date" name="date" value="${dateNow()}"></label><label class="field">Descripción<input name="description" required></label><label class="field">Categoría<input name="category" placeholder="Proveedor, hosting, publicidad..."></label><label class="field">Negocio<select name="biz">${BIZ.map(b=>`<option value="${b[0]}">${b[1]}</option>`).join('')}</select></label><label class="field">Importe<input name="amount" type="number" min="0" step="0.01" required></label><label class="field">Moneda<select name="currency">${CURRENCIES.map(c=>`<option ${c==='COP'?'selected':''}>${c}</option>`)}</select></label><label class="field">Tasa a COP<input name="rate" type="number" min="0" step="0.0001"></label><label class="field">Pagado desde<select name="accountId"><option value="">Sin asignar</option>${S.accounts.map(a=>`<option value="${a.id}">${esc(a.name)} (${a.currency})</option>`).join('')}</select></label><label class="field">Estado<select name="paymentStatus"><option value="pagado">Pagado</option><option value="pendiente">Pendiente</option></select></label><div class="row"><button class="btn primary">Guardar gasto</button></div></form></section><section class="panel"><h3 class="section-title">Historial de gastos</h3>${S.expenses.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Asignación</th><th>Importe</th><th>COP</th><th>Estado</th><th></th></tr>${S.expenses.filter(e=>!e.deleted).slice().reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.description)}</td><td>${esc(e.category)}</td><td>${businessName(e.biz)}</td><td>${fmtN(e.amount)} ${e.currency}</td><td>${fmt(e.amount*e.rate)}</td><td>${e.paymentStatus}</td><td><button class="btn small danger" onclick="voidRecord('expenses','${e.id}')">Anular</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Todavía no hay gastos registrados.</div>'}</section>`}
function addExpense(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),r=f.currency==='COP'?1:num(f.rate||rate(f.currency));if(!r)return alert('Indica la tasa de conversión a COP.');S.expenses.push({id:id('GAS'),date:f.date,description:f.description,category:f.category,biz:f.biz,amount:num(f.amount),currency:f.currency,rate:r,accountId:f.accountId,paymentStatus:f.paymentStatus,createdAt:new Date().toISOString(),deleted:false});audit('Gasto registrado',f.description);persist().then(render)}
function movesPage(){return `<section class="panel"><h3 class="section-title">${ic('moves',16)} Transferencia entre cuentas propias</h3><form class="formgrid" onsubmit="addTransfer(event)"><label class="field">Cuenta de origen<select name="from">${S.accounts.map(a=>`<option value="${a.id}">${esc(a.name)} (${a.currency})</option>`).join('')}</select></label><label class="field">Cuenta destino<select name="to">${S.accounts.map(a=>`<option value="${a.id}">${esc(a.name)} (${a.currency})</option>`).join('')}</select></label><label class="field">Importe que sale<input name="amountOut" type="number" min="0.01" step="0.01" required></label><label class="field">Importe que llega<input name="amountIn" type="number" min="0.01" step="0.01" required></label><label class="field">Cargo de transferencia<input name="fee" type="number" min="0" step="0.01" value="0"></label><label class="field">Fecha<input name="date" type="date" value="${dateNow()}"></label><label class="field full">Referencia / nota<input name="note"></label><div class="row"><button class="btn primary">Registrar transferencia</button></div></form><p class="muted">Las transferencias propias no son ventas ni gastos operativos.</p></section><section class="panel"><h3 class="section-title">Historial de transferencias</h3>${S.transfers.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Origen</th><th>Destino</th><th>Sale</th><th>Llega</th><th>Nota</th></tr>${S.transfers.slice().reverse().map(t=>{const a=S.accounts.find(x=>x.id===t.from),b=S.accounts.find(x=>x.id===t.to);return `<tr><td>${t.date}</td><td>${esc(a?.name||'Cuenta eliminada')}</td><td>${esc(b?.name||'Cuenta eliminada')}</td><td>${fmtN(t.amountOut)} ${a?.currency||''}</td><td>${fmtN(t.amountIn)} ${b?.currency||''}</td><td>${esc(t.note)}</td></tr>`}).join('')}</table></div>`:'<div class="empty">No hay transferencias registradas.</div>'}</section>`}
function addTransfer(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!f.from||!f.to)return alert('Crea primero al menos dos cuentas.');if(f.from===f.to)return alert('Origen y destino deben ser cuentas diferentes.');S.transfers.push({id:id('TR'),from:f.from,to:f.to,amountOut:num(f.amountOut),amountIn:num(f.amountIn),fee:num(f.fee),date:f.date,note:f.note});audit('Transferencia registrada',f.from+' → '+f.to);persist().then(render)}
function reportsPage(){const d=financialStats('D'),p=financialStats('P');const months={};for(const s of liveSales().filter(s=>s.status==='pagado')){const k=s.date.slice(0,7);months[k]??={sales:0,fees:0};months[k].sales+=saleGrossCOP(s);months[k].fees+=saleFeeCOP(s)}return `<section class="panel"><h3 class="section-title">${ic('chart',16)} Ventas mensuales (últimos 6 meses)</h3>${chartBars(monthlySalesData(6))}</section><section class="panel"><h3 class="section-title">${ic('pie',16)} Distribución de gastos</h3>${chartDonut(expensesByBusiness())}</section><section class="panel"><h3 class="section-title">Rentabilidad por negocio · Histórico</h3><div class="grid">${metric('Diamantes · utilidad',fmt(d.profit))}${metric('Programación · utilidad',fmt(p.profit))}${metric('Total antes de compartidos',fmt(d.profit+p.profit))}${metric('Gastos compartidos',fmt(sum(S.expenses.filter(e=>!e.deleted&&e.biz==='S'),e=>e.amount*e.rate)))}</div></section><section class="panel"><h3 class="section-title">Ventas y comisiones por mes</h3>${Object.keys(months).length?`<div class="tablewrap"><table><tr><th>Mes</th><th>Ventas cobradas COP</th><th>Comisiones + retenciones COP</th></tr>${Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>`<tr><td>${k}</td><td>${fmt(v.sales)}</td><td>${fmt(v.fees)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Aún no hay ventas pagadas.</div>'}</section><section class="panel"><h3 class="section-title">Calidad de los datos</h3><div class="grid">${metric('Ventas sin costo',liveSales().filter(s=>s.status==='pagado'&&s.cost===null).length)}${metric('Ventas sin cuenta',liveSales().filter(s=>s.status==='pagado'&&!s.accountId).length)}${metric('Ventas pendientes',liveSales().filter(s=>s.status==='pendiente').length)}${metric('Gastos pendientes',S.expenses.filter(e=>!e.deleted&&e.paymentStatus==='pendiente').length)}</div></section>`}
function backupPage(){return `<section class="panel"><h3 class="section-title">${ic('backup',16)} Respaldo completo</h3><div class="notice">Tu información se guarda únicamente en este navegador. Descarga respaldos frecuentes.</div><div class="row"><button class="btn primary" onclick="downloadBackup()">Descargar respaldo JSON</button><label class="btn filelabel">Cargar respaldo JSON<input type="file" accept=".json,application/json" onchange="restoreBackup(this)"></label></div><p class="muted">El archivo incluye ventas, clientes, cuentas, gastos, catálogo, transferencias, ajustes, tasas y auditoría.</p><p class="muted">Última actualización local: ${esc(S.updatedAt||'—')}</p></section><section class="panel"><h3 class="section-title">Tasas de conversión manuales</h3><form class="formgrid" onsubmit="saveRates(event)">${['USD','MXN','USDT'].map(c=>`<label class="field">1 ${c} equivale a COP<input type="number" name="${c}" min="0" step="0.0001" value="${num(S.settings.rates[c])||''}" placeholder="Introduce tasa"></label>`).join('')}<div class="row"><button class="btn primary">Guardar tasas</button></div></form></section><section class="panel"><h3 class="section-title">Auditoría local reciente</h3>${S.audit.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Acción</th><th>Detalle</th></tr>${S.audit.slice(0,100).map(a=>`<tr><td>${new Date(a.at).toLocaleString('es-CO')}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No hay eventos registrados.</div>'}</section>`}
function saveRates(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));for(const c of ['USD','MXN','USDT'])S.settings.rates[c]=num(f[c]);audit('Tasas actualizadas','USD, MXN y USDT');persist().then(render)}
function voidRecord(collection,rid){if(!confirm('¿Anular este registro? No se borrará físicamente; quedará marcado como anulado.'))return;const x=S[collection].find(v=>v.id===rid);if(!x)return;x.deleted=true;x.voidedAt=new Date().toISOString();audit('Registro anulado',rid);persist().then(render)}
function downloadBackup(){S.updatedAt=new Date().toISOString();const payload={...S,backupFormat:'BUSINESS_CONTROL_LOCAL_BACKUP',backupVersion:1,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BUSINESS-CONTROL-respaldo-'+dateNow()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);audit('Respaldo descargado','Exportación JSON');persist()}
function restoreBackup(input){const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=async()=>{try{const d=JSON.parse(reader.result);if(d.backupFormat!=='BUSINESS_CONTROL_LOCAL_BACKUP'||d.backupVersion!==1||!Array.isArray(d.sales)||!Array.isArray(d.accounts)||!Array.isArray(d.customers)||!Array.isArray(d.expenses)||!Array.isArray(d.transfers))throw new Error('Formato de respaldo no reconocido');if(!confirm(`El respaldo contiene ${d.sales.length} ventas, ${d.customers.length} clientes, ${d.accounts.length} cuentas y ${d.expenses.length} gastos. Se reemplazarán los datos actuales. ¿Continuar?`))return;const restored=ensureCatalog({...defaultState(),...d});delete restored.backupFormat;delete restored.backupVersion;delete restored.exportedAt;S=restored;audit('Respaldo restaurado',file.name);await persist();alert('Respaldo restaurado correctamente.');render()}catch(e){alert('No se pudo restaurar el archivo: '+e.message)}finally{input.value=''}};reader.readAsText(file)}

window.setPage=setPage;window.syncSaleCurrency=syncSaleCurrency;window.saveSale=saveSale;window.saveRates=saveRates;window.addAccount=addAccount;window.addExpense=addExpense;window.addTransfer=addTransfer;window.voidRecord=voidRecord;window.downloadBackup=downloadBackup;window.restoreBackup=restoreBackup;window.adjustAccount=adjustAccount;window.drawSales=drawSales;window.searchTerm=searchTerm;
window.selectProduct=selectProduct;window.selectCustomProduct=selectCustomProduct;window.switchBizTab=switchBizTab;
window.addProduct=addProduct;window.saveNewProduct=saveNewProduct;window.editProduct=editProduct;window.saveProductEdit=saveProductEdit;window.deleteProduct=deleteProduct;window.restoreDefaultCatalog=restoreDefaultCatalog;
window.openModal=openModal;window.closeModal=closeModal;
init();
</script></body></html>
